<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <title>Asteroids Miner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #pause-overlay, #shop-overlay, #death-overlay, #rescue-overlay, #transmissions-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            overflow-y: auto;
            padding: 20px;
        }
        #shop-overlay {
            justify-content: flex-start;
            padding-top: 60px;
            gap: 10px;
        }
        #transmissions-overlay {
            justify-content: flex-start;
            padding-top: 60px;
            gap: 8px;
        }
        #transmissions-log {
            width: 100%;
            max-width: 500px;
            max-height: 60vh;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            text-align: left;
        }
        .transmission-entry {
            border-left: 2px solid #3fb950;
            padding: 6px 10px;
            margin-bottom: 8px;
        }
        .transmission-entry .from { color: #58a6ff; margin-bottom: 2px; }
        .transmission-entry .msg { color: #3fb950; opacity: 0.9; }
        #pause-overlay.visible, #shop-overlay.visible, #death-overlay.visible, #rescue-overlay.visible, #transmissions-overlay.visible {
            display: flex;
        }
        #pause-overlay h1, #shop-overlay h1, #death-overlay h1, #rescue-overlay h1, #transmissions-overlay h1 {
            font-family: 'Courier New', monospace;
            color: #58a6ff;
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        #death-overlay h1 { color: #f85149; }
        #rescue-overlay h1 { color: #f0883e; }
        #pause-overlay p, #shop-overlay p, #death-overlay p, #rescue-overlay p {
            font-family: 'Courier New', monospace;
            color: #8b949e;
            font-size: 1rem;
        }
        .btn {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 10px 28px;
            background: transparent;
            border: 2px solid #58a6ff;
            color: #58a6ff;
            cursor: pointer;
            letter-spacing: 2px;
            transition: background 0.2s, color 0.2s;
        }
        .btn:hover { background: #58a6ff; color: #0d1117; }
        .btn:disabled { opacity: 0.3; cursor: default; border-color: #8b949e; color: #8b949e; }
        .btn:disabled:hover { background: transparent; color: #8b949e; }
        .btn-sell { border-color: #3fb950; color: #3fb950; }
        .btn-sell:hover { background: #3fb950; color: #0d1117; }
        #pause-button {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 60;
            width: 44px;
            height: 44px;
            background: transparent;
            border: 2px solid #8b949e;
            color: #8b949e;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #joystick-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            z-index: 50;
        }
        #fire-button {
            display: none;
        }
        #aim-zone {
            display: none;
            position: fixed;
            top: 70px;
            bottom: 0;
            right: 0;
            width: 50%;
            z-index: 50;
        }
        #dock-button {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            font-size: 1.2rem;
            padding: 12px 32px;
        }
        #dock-button.visible { display: block; }
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #rotate-overlay span { font-size: 3rem; }
        #rotate-overlay p { font-family: 'Courier New', monospace; color: #8b949e; font-size: 1rem; }
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            #rotate-overlay { display: flex; }
        }
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }
        .settings-group label {
            font-family: 'Courier New', monospace;
            color: #8b949e;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .settings-row {
            display: flex;
            gap: 8px;
        }
        .settings-row button {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            padding: 5px 12px;
            background: transparent;
            border: 1px solid #8b949e;
            color: #8b949e;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .settings-row button.active { border-color: #58a6ff; color: #58a6ff; }
        .shop-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .upgrade-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .upgrade-name { color: #c9d1d9; min-width: 80px; }
        .upgrade-pips { letter-spacing: 2px; }
        .upgrade-cost { color: #3fb950; min-width: 50px; text-align: right; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <button id="pause-button">&#10074;&#10074;</button>
    <div id="pause-overlay">
        <h1>Paused</h1>
        <p>Asteroids Miner</p>
        <div class="settings-group" id="mobile-settings" style="display:none">
            <label>Joystick Side</label>
            <div class="settings-row" id="joystick-side-btns">
                <button data-value="left" class="active">Left</button>
                <button data-value="right">Right</button>
            </div>
            <label>Joystick Mode</label>
            <div class="settings-row" id="joystick-mode-btns">
                <button data-value="static" class="active">Fixed</button>
                <button data-value="semi">Semi</button>
                <button data-value="dynamic">Float</button>
            </div>
        </div>
        <button class="btn" id="resume-btn">Resume</button>
        <div id="pause-stats" style="margin-top:16px;text-align:left;font:10px Courier New;color:#6e7681;line-height:1.6"></div>
        <button class="btn" id="transmissions-btn" style="margin-top:12px;border-color:#3fb950;color:#3fb950;font-size:0.7rem">TRANSMISSIONS</button>
        <button class="btn" id="cheat-btn" style="margin-top:8px;border-color:#3fb950;color:#3fb950;font-size:0.7rem">$$$ CHEAT $$$</button>
        <button class="btn" id="reset-btn" style="margin-top:8px;border-color:#f85149;color:#f85149;font-size:0.7rem">RESET SAVE</button>
    </div>
    <div id="transmissions-overlay">
        <h1>Transmissions</h1>
        <div id="transmissions-log"></div>
        <button class="btn" id="transmissions-back-btn">BACK</button>
    </div>
    <div id="shop-overlay">
        <h1>Home Base</h1>
        <p id="shop-credits">CREDITS: 0</p>
        <p id="shop-cargo">CARGO: 0/8</p>
        <div id="cargo-breakdown" style="font-family:'Courier New',monospace;font-size:0.8rem;width:100%;max-width:400px"></div>
        <button class="btn btn-sell" id="sell-btn">SELL ALL</button>
        <div class="shop-section" id="shop-upgrades"></div>
        <p style="color:#3fb950;margin-top:12px;font-family:'Courier New',monospace;font-size:0.9rem">— BASE —</p>
        <div class="shop-section" id="shop-base-upgrades"></div>
        <button class="btn" id="undock-btn">UNDOCK</button>
    </div>
    <div id="death-overlay">
        <h1>Destroyed</h1>
        <p id="death-msg">Cargo lost. Hull downgraded.</p>
        <button class="btn" id="respawn-btn">RESPAWN</button>
    </div>
    <div id="rescue-overlay">
        <h1>OUT OF FUEL</h1>
        <p id="rescue-msg">Cargo dumped. Rescue fee: 5 CR.</p>
        <button class="btn" id="rescue-btn">RESCUE ME</button>
    </div>
    <div id="rotate-overlay">
        <span>&#x21BB;</span>
        <p>Rotate to landscape</p>
    </div>
    <button id="dock-button" class="btn btn-sell">DOCK</button>
    <div id="joystick-zone"></div>
    <div id="aim-zone"></div>
    <button id="fire-button">FIRE</button>

    <script src="https://unpkg.com/nipplejs@0.10.2/dist/nipplejs.js"></script>
    <script>
    (function() {
        'use strict';

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Constants ---
        const SHIP_ACCEL = 400;
        const SHIP_MAX_SPEED = 350;
        const SHIP_DRAG = 0.98;
        const SHIP_SIZE = 18;
        const BULLET_SPEED = 600;
        const BULLET_LIFETIME = 1.2;
        const BULLET_LENGTH = 12;
        const FIRE_RATE_BASE = 0.25;
        const AUTOAIM_RANGE = 400;
        const ROCK_ACTIVE_RADIUS = 1200;
        const ROCK_DESPAWN_RADIUS = 1500;
        const ROCK_BASE_DENSITY = 6;
        const ROCK_MAX_COUNT = 30;
        const ROCK_DRIFT_BASE = 30;
        const RESOURCE_COLLECT_RADIUS = 35;
        const RESOURCE_LIFETIME = 30;
        const FUEL_DRAIN_RATE = 8;
        const COLLISION_DAMAGE = 1;
        const INVULN_TIME = 1.5;
        const BASE_DOCK_RADIUS = 60;
        const BASE_DOCK_SPEED = 40;
        const BASE_SAFE_RADIUS = 300;
        const UPGRADE_COSTS = {
            basic: [10, 25, 60, 120, 250],
            mid:   [15, 40, 90, 180, 350],
            high:  [25, 60, 140, 280, 500],
            elite: [40, 100, 250, 500, 900]
        };
        const STAR_COUNT = 200;
        const STAR_FIELD_SIZE = 2000;
        const PARTICLE_MAX = 120;

        const ROCK_TIERS = {
            large:  { radius: 40, hp: 3, children: 2, childTier: 'medium' },
            medium: { radius: 24, hp: 2, children: 2, childTier: 'small' },
            small:  { radius: 14, hp: 1, children: 0, childTier: null }
        };

        const RESOURCE_TYPES = [
            { name: 'iron',     color: '#6e7681', minDist: 0,    value: 2 },
            { name: 'copper',   color: '#da6d28', minDist: 500,  value: 5 },
            { name: 'gold',     color: '#f7d944', minDist: 1500, value: 12 },
            { name: 'platinum', color: '#f0f3f6', minDist: 3000, value: 25 },
            { name: 'crystal',  color: '#3fb950', minDist: 5000, value: 60 },
            { name: 'scrap',    color: '#f85149', minDist: 99999, value: 8 }
        ];

        const UPGRADE_DEFS = [
            { key: 'hull',        label: 'HULL',         desc: '+1 max HP', tier: 'basic' },
            { key: 'fuel',        label: 'FUEL',         desc: '+25 tank', tier: 'basic' },
            { key: 'cargo',       label: 'CARGO',        desc: '+4 slots', tier: 'basic' },
            { key: 'speed',       label: 'SPEED',        desc: '+50 max', tier: 'mid', reqHull: 1 },
            { key: 'fireRate',    label: 'GUN RATE',     desc: 'faster manual', tier: 'mid', reqHull: 1 },
            { key: 'thrust',      label: 'THRUST',       desc: '+100 accel', tier: 'mid', reqHull: 1 },
            { key: 'efficiency',  label: 'EFFICIENCY',   desc: '-15% fuel drain', tier: 'mid', reqHull: 1 },
            { key: 'turretRate',  label: 'TURRET RATE',  desc: 'faster auto', tier: 'mid', reqHull: 1 },
            { key: 'turretRange', label: 'TURRET RANGE', desc: '+100 range', tier: 'high', reqHull: 2 },
            { key: 'scanner',     label: 'SCANNER',      desc: 'better drops', tier: 'high', reqHull: 2 },
            { key: 'density',     label: 'DENSITY',      desc: 'more rocks', tier: 'high', reqHull: 2 },
            { key: 'shield',      label: 'SHIELD',       desc: '+0.5s invuln', tier: 'high', reqHull: 2 },
            { key: 'dash',        label: 'DASH',         desc: 'speed burst', tier: 'high', reqHull: 2 },
            { key: 'magnet',      label: 'MAGNET',       desc: 'pull resources', tier: 'elite', reqHull: 3 },
            { key: 'piercing',    label: 'PIERCING',     desc: 'bullets pass through', tier: 'elite', reqHull: 3 },
            { key: 'salvage',     label: 'SALVAGE',      desc: '+1 enemy drops', tier: 'elite', reqHull: 3 },
            { key: 'telesale',    label: 'TELESALE',     desc: 'auto-sell cheap', tier: 'elite', reqBase: 'sellBonus' }
        ];

        const BASE_UPGRADE_DEFS = [
            { key: 'sellBonus', label: 'TRADE HUB', desc: '+15% sell', costs: [50, 150, 400] },
            { key: 'defense',   label: 'DEFENSE',   desc: 'auto-destroy near base', costs: [75, 200, 500] },
            { key: 'beacon',    label: 'BEACON',    desc: '+100 safe zone', costs: [100, 300, 600] },
            { key: 'refinery',  label: 'REFINERY',  desc: '+20% platinum/crystal', costs: [150, 400, 800] }
        ];

        const TRANSMISSIONS = [
            { id: 'welcome', trigger: 'dock', condition: s => s.totalDocks === 1,
              from: 'KOREX MINING HQ', text: 'Welcome aboard, Miner. Korex Mineral Corp thanks you for signing on. Mine resources, return to base, sell for credits. Simple as that. Good luck out there.' },
            { id: 'first_sell', trigger: 'sell', condition: s => s.totalSells === 1,
              from: 'KOREX MINING HQ', text: "First haul registered. Keep at it — there's plenty out there. Upgrade your rig when you can afford it." },
            { id: 'dist_500', trigger: 'distance', condition: s => s.maxDist >= 500,
              from: 'KOREX MINING HQ', text: "You're pushing further than most rookies. Richer deposits out there, but watch your fuel." },
            { id: 'dist_1500', trigger: 'distance', condition: s => s.maxDist >= 1500,
              from: 'KOREX MINING HQ', text: 'Excellent progress. The outer fields are uncharted. Some pilots report... interference. Probably just solar wind.' },
            { id: 'first_death', trigger: 'death', condition: s => s.totalDeaths === 1,
              from: 'KOREX SUPPORT', text: 'Hull failure recorded. Reconstruction costs have been deducted. Remember: Korex cares about your safety. Mostly.' },
            { id: 'dist_2000', trigger: 'distance', condition: s => s.maxDist >= 2000,
              from: '???', text: '...signal detected... non-natural... avoid sector 7-G... they are watching...' },
            { id: 'first_enemy', trigger: 'enemy_kill', condition: s => s.enemiesKilled === 1,
              from: 'KOREX MINING HQ', text: "Hostile contact neutralized. We... weren't aware of activity in that sector. Disregard and continue mining." },
            { id: 'dist_3000', trigger: 'distance', condition: s => s.maxDist >= 3000,
              from: 'UNKNOWN FREQUENCY', text: "Miner — if you can hear this — the drones aren't malfunctioning. Korex put them there. Do not trust HQ transmissions." },
            { id: 'kills_10', trigger: 'enemy_kill', condition: s => s.enemiesKilled >= 10,
              from: 'KOREX SECURITY', text: 'Your combat data is... impressive. We may have a special assignment for you. Stand by.' },
            { id: 'dist_5000', trigger: 'distance', condition: s => s.maxDist >= 5000,
              from: 'ENCRYPTED SIGNAL', text: "They call it Project Hollow Core. The asteroids aren't natural. None of this is. Get out while you can." },
            { id: 'quest_complete_3', trigger: 'quest_complete', condition: s => s.questsCompleted >= 3,
              from: 'KOREX DIRECTOR VOSS', text: "You've exceeded expectations. Most miners don't last this long. We'd like to offer you... a promotion. Details incoming." },
            { id: 'kills_5', trigger: 'enemy_kill', condition: s => s.enemiesKilled >= 5,
              from: 'KOREX SECURITY', text: "Security drones should not be engaging miners. Must be a software glitch. Keep reporting contacts." },
            { id: 'dist_4000', trigger: 'distance', condition: s => s.maxDist >= 4000,
              from: '???', text: "Still alive? Good. The drones get worse past 4k. There's a reason Korex doesn't want you out here." },
            { id: 'dist_6000', trigger: 'distance', condition: s => s.maxDist >= 6000,
              from: 'KOREX DIRECTOR VOSS', text: "Impressive range, contractor. You've exceeded expected parameters. Consider... slowing down." },
            { id: 'kills_25', trigger: 'enemy_kill', condition: s => s.enemiesKilled >= 25,
              from: 'UNKNOWN FREQUENCY', text: "You fight well. The drones will adapt. Korex is watching your kill count. Be careful what you become." },
            { id: 'dist_7000', trigger: 'distance', condition: s => s.maxDist >= 7000,
              from: 'ENCRYPTED SIGNAL', text: "I was a miner too. Contract 4471. Went to 8000m and found something in the rocks. Something alive. They tried to silence me." },
            { id: 'dist_8000', trigger: 'distance', condition: s => s.maxDist >= 8000,
              from: '[SIGNAL ORIGIN: INSIDE ASTEROID]', text: 'We have been sleeping. Your drilling wakes us. We do not wish conflict. Tell your masters: stop digging. This is your only warning.' },
            { id: 'dist_9000', trigger: 'distance', condition: s => s.maxDist >= 9000,
              from: '[SIGNAL ORIGIN: INSIDE ASTEROID]', text: "We are not resources. We are not yours. But we do not blame the tool. Only the hand." },
            { id: 'dist_10000', trigger: 'distance', condition: s => s.maxDist >= 10000,
              from: 'KOREX AUTOMATED', text: "CONTRACT VIOLATION DETECTED. Miner unit exceeding operational boundary. Retrieval authorized." },
            { id: 'kills_50', trigger: 'enemy_kill', condition: s => s.enemiesKilled >= 50,
              from: 'KOREX SECURITY', text: "Enough. Those 'drones' cost more than your contract is worth. Last warning, miner." },
            { id: 'dist_12000', trigger: 'distance', condition: s => s.maxDist >= 12000,
              from: 'CONTRACT 4471', text: "Past 12k, the rocks glow. You'll see. That's them dreaming. Korex calls it 'crystal' but it's not mineral. It's memory." },
            { id: 'dist_14000', trigger: 'distance', condition: s => s.maxDist >= 14000,
              from: '[SIGNAL ORIGIN: INSIDE ASTEROID]', text: "You carry our fragments home and sell them. We feel each one go. But you also destroy the machines. Perhaps you are different." },
            { id: 'dist_16000', trigger: 'distance', condition: s => s.maxDist >= 16000,
              from: 'KOREX DIRECTOR VOSS', text: "Let me be direct: the entity in the asteroids is valuable beyond measure. We WILL extract it. You can be part of that future, or be removed from it." },
            { id: 'dist_20000', trigger: 'distance', condition: s => s.maxDist >= 20000,
              from: '[ALL FREQUENCIES]', text: "You've gone further than any miner. The edge of Korex's reach. What you do now... is your choice alone." },
            { id: 'return_20k', trigger: 'dock', condition: s => s.maxDist >= 20000,
              from: 'CONTRACT 4471', text: "You came back. I never did. Whatever you decide... thanks for proving it was possible." },
        ];

        const QUEST_TRACKS = {
            mining: {
                label: 'MINING', color: '#da6d28', icon: '⛏',
                unlockCondition: s => s.totalDocks >= 1,
                quests: [
                    { name: 'First Haul', desc: 'Mine 5 asteroids', type: 'mine', target: 5, reward: 15 },
                    { name: 'Copper Rush', desc: 'Collect 5 copper', type: 'collect', resource: 'copper', target: 5, reward: 30 },
                    { name: 'Bulk Hauler', desc: 'Sell 20 resources total', type: 'sell_count', target: 20, reward: 50 },
                    { name: 'Gold Fever', desc: 'Collect 5 gold', type: 'collect', resource: 'gold', target: 5, reward: 60 },
                    { name: 'Platinum Standard', desc: 'Collect 3 platinum', type: 'collect', resource: 'platinum', target: 3, reward: 80 },
                    { name: 'Full Load', desc: 'Sell with full cargo', type: 'sell_full', target: 1, reward: 100 },
                    { name: 'Crystal Clear', desc: 'Collect 3 crystal', type: 'collect', resource: 'crystal', target: 3, reward: 120 },
                    { name: 'Mineral Baron', desc: 'Sell 500cr in one trip', type: 'sell_value', target: 500, reward: 200 },
                ]
            },
            exploration: {
                label: 'EXPLORE', color: '#58a6ff', icon: '☉',
                unlockCondition: s => s.maxDist >= 500,
                quests: [
                    { name: 'First Steps', desc: 'Reach distance 800', type: 'distance', target: 800, reward: 20 },
                    { name: 'Beyond the Belt', desc: 'Reach distance 2000', type: 'distance', target: 2000, reward: 40 },
                    { name: 'Deep Space', desc: 'Reach distance 4000', type: 'distance', target: 4000, reward: 70 },
                    { name: 'The Outer Rim', desc: 'Reach distance 6000', type: 'distance', target: 6000, reward: 100 },
                    { name: 'Signal Source', desc: 'Reach distance 8000', type: 'distance', target: 8000, reward: 130 },
                    { name: 'The Void', desc: 'Reach distance 10000', type: 'distance', target: 10000, reward: 180 },
                    { name: 'Edge of Known Space', desc: 'Reach distance 14000', type: 'distance', target: 14000, reward: 250 },
                    { name: 'Event Horizon', desc: 'Reach distance 20000', type: 'distance', target: 20000, reward: 400 },
                ]
            },
            combat: {
                label: 'COMBAT', color: '#f85149', icon: '⚔',
                unlockCondition: s => s.enemiesKilled >= 1,
                quests: [
                    { name: 'First Blood', desc: 'Destroy 3 hostiles', type: 'kill', target: 3, reward: 25 },
                    { name: 'Pest Control', desc: 'Destroy 10 hostiles', type: 'kill', target: 10, reward: 50 },
                    { name: 'Survivor', desc: 'Return from 3000+ alive', type: 'return_alive', target: 3000, reward: 75 },
                    { name: 'Enforcer', desc: 'Destroy 25 hostiles', type: 'kill', target: 25, reward: 100 },
                    { name: 'Drone Hunter', desc: 'Destroy 5 drones in one trip', type: 'kill_type', killType: 'drone', target: 5, reward: 80 },
                    { name: 'Gunship Buster', desc: 'Destroy 3 gunships', type: 'kill_type', killType: 'gunship', target: 3, reward: 150 },
                    { name: 'Untouchable', desc: 'Return from 5000+ full hull', type: 'return_full_hull', target: 5000, reward: 200 },
                    { name: 'Warden', desc: 'Destroy 100 hostiles', type: 'kill', target: 100, reward: 300 },
                ]
            },
            story: {
                label: 'STORY', color: '#3fb950', icon: '◈',
                unlockCondition: s => s.totalDocks >= 3,
                quests: [
                    { name: 'Report In', desc: 'Dock at base 3 times', type: 'dock', target: 3, reward: 20 },
                    { name: 'Corporate Interests', desc: 'Reach distance 2000', type: 'distance', target: 2000, reward: 50 },
                    { name: 'The Signal', desc: 'Reach distance 5000', type: 'distance', target: 5000, reward: 100 },
                    { name: 'Investigate', desc: 'Destroy 15 enemies', type: 'kill', target: 15, reward: 150 },
                    { name: 'Deep Cover', desc: 'Reach distance 12000', type: 'distance', target: 12000, reward: 250 },
                    { name: 'The Truth', desc: 'Reach 20000 and return', type: 'return_alive', target: 20000, reward: 500 },
                ]

        };

        const ENEMY_BULLET_SPEED = 300;
        const ENEMY_BULLET_LIFETIME = 1.5;

        // --- Game State ---
        const gameState = {
            paused: false,
            shopOpen: false,
            dead: false,
            ship: {
                x: 0, y: 0,
                angle: -Math.PI / 2,
                vx: 0, vy: 0,
                thrust: 0,

                hull: 3, maxHull: 3,
                fuel: 100, maxFuel: 100,

                turretTimer: 0,
                invulnTimer: 0,
                dashTimer: 0,
                dashCooldown: 0
            },
            camera: { x: 0, y: 0 },
            base: { x: 0, y: 0, radius: BASE_DOCK_RADIUS, pulse: 0 },
            bullets: [],
            rocks: [],
            particles: [],
            resources: [],
            enemies: [],
            enemyBullets: [],
            stars: [],
            keys: {},
            mouse: { x: 0, y: 0, down: false },

            aimJoystick: { active: false, angle: 0 },

            baseUpgrades: { sellBonus: 0, defense: 0, beacon: 0, refinery: 0 },

            fuelWarnFlash: 0,
            fuelWarnMsg: '',
            story: {
                seen: [],
                queue: [],
                active: null,
                stats: { maxDist: 0, totalDocks: 0, totalSells: 0, totalDeaths: 0, enemiesKilled: 0, questsCompleted: 0 }
            },
            questTracks: {
                mining: { current: 0, progress: 0, unlocked: false },
                exploration: { current: 0, progress: 0, unlocked: false },
                combat: { current: 0, progress: 0, unlocked: false },

            },

        };

        function getSafeRadius() {
            return BASE_SAFE_RADIUS + gameState.baseUpgrades.beacon * 100;
        }

        function applyUpgrades() {
            const u = gameState.upgrades;
            const ship = gameState.ship;
            ship.maxHull = 3 + u.hull;
            ship.maxFuel = 100 + u.fuel * 25;
            ship.maxCargo = 8 + u.cargo * 4;
            gameState.derived = {
                maxSpeed: SHIP_MAX_SPEED + u.speed * 50,
                fireRate: FIRE_RATE_BASE * Math.pow(0.8, u.fireRate),
                accel: SHIP_ACCEL + u.thrust * 100,
                fuelMult: 1 - u.efficiency * 0.15,
                invulnTime: INVULN_TIME + u.shield * 0.5,
                dashCooldown: u.dash > 0 ? (3 - u.dash * 0.4) : 0,
                pierceCount: u.piercing,
                salvageBonus: u.salvage
            };
        }

        function saveGame() {
            try {
                localStorage.setItem('asteroids-save', JSON.stringify({
                    upgrades: gameState.upgrades,
                    baseUpgrades: gameState.baseUpgrades,
                    credits: gameState.credits,
                    story: { seen: gameState.story.seen, stats: gameState.story.stats },
                    questTracks: gameState.questTracks,
                    prestige: gameState.prestige,
                    shipColor: gameState.shipColor
                }));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem('asteroids-save'));
                if (saved) {
                    Object.assign(gameState.upgrades, saved.upgrades);
                    if (saved.baseUpgrades) Object.assign(gameState.baseUpgrades, saved.baseUpgrades);
                    gameState.credits = saved.credits || 0;
                    if (saved.story) {
                        gameState.story.seen = saved.story.seen || [];
                        Object.assign(gameState.story.stats, saved.story.stats);
                    }
                    if (saved.questTracks) {
                        for (const [k, v] of Object.entries(saved.questTracks)) {
                            if (gameState.questTracks[k]) Object.assign(gameState.questTracks[k], v);
                        }
                    } else if (saved.quest) {
                        // Migrate old linear quest saves
                        const stats = gameState.story.stats;
                        gameState.questTracks.mining.unlocked = true;
                        if (stats.maxDist >= 500) gameState.questTracks.exploration.unlocked = true;
                        if (stats.enemiesKilled >= 1) gameState.questTracks.combat.unlocked = true;
                        if (stats.totalDocks >= 3) gameState.questTracks.story.unlocked = true;
                    }
                    if (saved.prestige) gameState.prestige = saved.prestige;
                    if (saved.shipColor) gameState.shipColor = saved.shipColor;
                    applyUpgrades();
                    gameState.ship.hull = gameState.ship.maxHull;
                    gameState.ship.fuel = gameState.ship.maxFuel;
                }
            } catch(e) {}
        }

        // --- Transmissions & Quests ---
        function checkTransmissions(triggerType) {
            const stats = gameState.story.stats;
            for (const t of TRANSMISSIONS) {
                if (t.trigger !== triggerType) continue;
                if (gameState.story.seen.includes(t.id)) continue;
                if (t.condition(stats)) {
                    gameState.story.seen.push(t.id);
                    gameState.story.queue.push({ id: t.id, from: t.from, text: t.text, charIndex: 0, timer: 0 });
                }
            }
        }

        function updateTransmission(dt) {
            const story = gameState.story;
            if (!story.active && story.queue.length > 0) {
                story.active = story.queue.shift();
            }
            if (story.active) {
                const t = story.active;
                if (t.charIndex < t.text.length) {
                    t.charIndex += dt * 30;
                } else {
                    t.timer += dt;
                    if (t.timer > 4) story.active = null;
                }
            }
        }

        function dismissTransmission() {
            if (gameState.story.active) {
                const t = gameState.story.active;
                if (t.charIndex >= t.text.length) {
                    gameState.story.active = null;
                } else {
                    t.charIndex = t.text.length;
                }
            }
        }

        function recordKill(enemyType) {
            gameState.story.stats.enemiesKilled++;
            gameState.tripStats.kills[enemyType] = (gameState.tripStats.kills[enemyType] || 0) + 1;
            checkTransmissions('enemy_kill');
            advanceQuest('kill');
            advanceQuest('kill_type', enemyType);
            checkQuestUnlocks();
        }

        function checkQuestUnlocks() {
            const stats = gameState.story.stats;
            for (const [trackId, track] of Object.entries(QUEST_TRACKS)) {
                const qt = gameState.questTracks[trackId];
                if (!qt.unlocked && track.unlockCondition(stats)) {
                    qt.unlocked = true;
                    // Auto-check distance quests already past target
                    const quest = track.quests[qt.current];
                    if (quest && quest.type === 'distance') advanceQuest('distance');
                }
            }
        }

        function advanceQuest(type, resource) {
            const stats = gameState.story.stats;
            for (const [trackId, track] of Object.entries(QUEST_TRACKS)) {
                const qt = gameState.questTracks[trackId];
                if (!qt.unlocked || qt.current >= track.quests.length) continue;
                const quest = track.quests[qt.current];

                let matched = false;
                if (quest.type === type) {
                    if (quest.resource && quest.resource !== resource) continue;
                    if (quest.killType && quest.killType !== resource) continue;
                    if (type === 'distance') {
                        const dist = Math.sqrt(gameState.ship.x ** 2 + gameState.ship.y ** 2);
                        if (dist >= quest.target) { qt.progress = quest.target; matched = true; }
                    } else if (type === 'return_alive') {
                        const dist = Math.sqrt(gameState.ship.x ** 2 + gameState.ship.y ** 2);
                        if (gameState.tripStats.maxDist >= quest.target && dist < BASE_DOCK_RADIUS * 2) {
                            qt.progress = quest.target; matched = true;
                        }
                    } else if (type === 'return_full_hull') {
                        const dist = Math.sqrt(gameState.ship.x ** 2 + gameState.ship.y ** 2);
                        if (gameState.tripStats.maxDist >= quest.target && dist < BASE_DOCK_RADIUS * 2 && gameState.ship.hull >= gameState.ship.maxHull) {
                            qt.progress = quest.target; matched = true;
                        }
                    } else if (type === 'sell_full') {
                        matched = true; qt.progress++;
                    } else if (type === 'sell_value') {
                        // progress is set directly by caller with the sell amount
                        matched = true;
                    } else if (type === 'sell_count') {
                        matched = true; qt.progress++;
                    } else {
                        qt.progress++; matched = true;
                    }
                }

                if (matched && qt.progress >= quest.target) {
                    gameState.credits += quest.reward;
                    gameState.story.stats.questsCompleted++;
                    gameState.questFlash = 2.5;
                    qt.current++;
                    qt.progress = 0;
                    checkTransmissions('quest_complete');
                    saveGame();
                    // Auto-check if next quest is distance and already satisfied
                    if (qt.current < track.quests.length && track.quests[qt.current].type === 'distance') {
                        advanceQuest('distance');
                    }
                }
            }
        }

        // --- Stars ---
        function generateStars() {
            gameState.stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                gameState.stars.push({
                    x: (Math.random() - 0.5) * STAR_FIELD_SIZE,
                    y: (Math.random() - 0.5) * STAR_FIELD_SIZE,
                    size: Math.random() * 1.5 + 0.5,
                    brightness: Math.random() * 0.5 + 0.3,
                    layer: Math.random() < 0.3 ? 0.3 : Math.random() < 0.6 ? 0.6 : 1
                });
            }
        }
        generateStars();

        // --- Mobile ---
        function detectMobile() {
            gameState.isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (gameState.isMobile) {
                document.getElementById('aim-zone').style.display = 'block';
                document.getElementById('mobile-settings').style.display = 'flex';
                try { screen.orientation.lock('landscape'); } catch(e) {}
                loadSettings();
                setupJoystick();
            }
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('asteroids-settings');
                if (saved) Object.assign(gameState.settings, JSON.parse(saved));
            } catch(e) {}
            syncSettingsUI();
        }

        function saveSettings() {
            try { localStorage.setItem('asteroids-settings', JSON.stringify(gameState.settings)); } catch(e) {}
        }

        function syncSettingsUI() {
            document.querySelectorAll('#joystick-side-btns button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === gameState.settings.joystickSide);
            });
            document.querySelectorAll('#joystick-mode-btns button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === gameState.settings.joystickMode);
            });
        }

        let joystickManager = null;
        let aimManager = null;
        function setupJoystick() {
            if (typeof nipplejs === 'undefined') return;
            if (joystickManager) { joystickManager.destroy(); joystickManager = null; }
            if (aimManager) { aimManager.destroy(); aimManager = null; }

            const zone = document.getElementById('joystick-zone');
            const aimZone = document.getElementById('aim-zone');
            const side = gameState.settings.joystickSide;
            const mode = gameState.settings.joystickMode;

            zone.style.left = side === 'left' ? '0' : 'auto';
            zone.style.right = side === 'right' ? '0' : 'auto';
            aimZone.style.left = side === 'right' ? '0' : 'auto';
            aimZone.style.right = side === 'left' ? '0' : 'auto';

            const opts = { zone, mode, color: '#58a6ff', size: 120 };
            if (mode === 'static') {
                opts.position = side === 'left' ? { left: '100px', bottom: '100px' } : { right: '100px', bottom: '100px' };
            }
            if (mode === 'semi') opts.catchDistance = 150;

            joystickManager = nipplejs.create(opts);
            joystickManager.on('move', function(evt, data) {
                gameState.joystick.active = true;
                gameState.joystick.angle = data.angle.radian;
                gameState.joystick.force = Math.min(data.force / 2, 1);
            });
            joystickManager.on('end', function() {
                gameState.joystick.active = false;
                gameState.joystick.force = 0;
            });

            const aimOpts = { zone: aimZone, mode: 'semi', color: '#f85149', size: 100, catchDistance: 100 };
            aimManager = nipplejs.create(aimOpts);
            aimManager.on('move', function(evt, data) {
                gameState.aimJoystick.active = true;
                gameState.aimJoystick.angle = data.angle.radian;
            });
            aimManager.on('end', function() {
                gameState.aimJoystick.active = false;
            });
        }

        // --- Input ---
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
            if (e.code === 'Escape') togglePause();
            dismissTransmission();
        });
        window.addEventListener('keyup', (e) => { gameState.keys[e.code] = false; });
        canvas.addEventListener('mousemove', (e) => {
            gameState.mouse.x = e.clientX;
            gameState.mouse.y = e.clientY;
        });
        canvas.addEventListener('mousedown', () => { gameState.mouse.down = true; dismissTransmission(); });
        canvas.addEventListener('mouseup', () => { gameState.mouse.down = false; });

        document.getElementById('pause-button').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('cheat-btn').addEventListener('click', function() {
            gameState.credits += 99999;
            saveGame();
        });
        document.getElementById('reset-btn').addEventListener('click', function() {
            if (confirm('Reset all progress?')) {
                localStorage.removeItem('asteroids-save');
                location.reload();
            }
        });
        document.getElementById('transmissions-btn').addEventListener('click', function() {
            document.getElementById('pause-overlay').classList.remove('visible');
            const log = document.getElementById('transmissions-log');
            log.innerHTML = '';
            const seen = gameState.story.seen;
            if (seen.length === 0) {
                log.innerHTML = '<p style="color:#8b949e;text-align:center">No transmissions received yet.</p>';
            } else {
                for (const id of seen) {
                    const t = TRANSMISSIONS.find(tr => tr.id === id);
                    if (!t) continue;
                    const entry = document.createElement('div');
                    entry.className = 'transmission-entry';
                    entry.innerHTML = `<div class="from">[${t.from}]</div><div class="msg">${t.text}</div>`;
                    log.appendChild(entry);
                }
            }
            document.getElementById('transmissions-overlay').classList.add('visible');
        });
        document.getElementById('transmissions-back-btn').addEventListener('click', function() {
            document.getElementById('transmissions-overlay').classList.remove('visible');
            document.getElementById('pause-overlay').classList.add('visible');
        });
        document.getElementById('joystick-side-btns').addEventListener('click', function(e) {
            if (!e.target.dataset.value) return;
            gameState.settings.joystickSide = e.target.dataset.value;
            saveSettings(); syncSettingsUI(); setupJoystick();
        });
        document.getElementById('joystick-mode-btns').addEventListener('click', function(e) {
            if (!e.target.dataset.value) return;
            gameState.settings.joystickMode = e.target.dataset.value;
            saveSettings(); syncSettingsUI(); setupJoystick();
        });

        // Fire button removed — replaced by aim joystick

        function togglePause() {
            if (gameState.shopOpen || gameState.dead || gameState.stranded || gameState.rescued) return;
            gameState.paused = !gameState.paused;
            document.getElementById('pause-overlay').classList.toggle('visible', gameState.paused);
            if (gameState.paused) {
                const s = gameState.story.stats;
                const dist = Math.floor(Math.sqrt(gameState.ship.x**2 + gameState.ship.y**2));
                document.getElementById('pause-stats').innerHTML =
                    `MAX DIST: ${s.maxDist || 0}m<br>` +
                    `ENEMIES KILLED: ${s.enemiesKilled || 0}<br>` +
                    `TOTAL DOCKS: ${s.totalDocks || 0}<br>` +
                    `TOTAL DEATHS: ${s.totalDeaths || 0}<br>` +
                    `CREDITS EARNED: ${s.totalCredits || 0}<br>` +
                    `CURRENT DIST: ${dist}m`;
            }
            if (!gameState.paused) {
                gameState.lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        // --- Docking ---
        document.getElementById('dock-button').addEventListener('click', function() {
            const ship = gameState.ship;
            gameState.docked = true;
            ship.fuel = ship.maxFuel;
            ship.invulnTimer = 0;
            ship.vx = 0; ship.vy = 0;
            spawnParticles(ship.x, ship.y, 15, '#58a6ff', 100);
            spawnParticles(ship.x, ship.y, 10, '#3fb950', 80);
            document.getElementById('dock-button').classList.remove('visible');
            gameState.story.stats.totalDocks++;
            checkTransmissions('dock');
            advanceQuest('dock');
            advanceQuest('return_alive');
            if (ship.hull >= ship.maxHull) advanceQuest('return_full_hull');
            ship.hull = ship.maxHull;
            checkQuestUnlocks();
            gameState.tripStats = { kills: {}, maxDist: 0, startHull: ship.maxHull };
            openShop();
        });

        // --- Shop ---
        document.getElementById('sell-btn').addEventListener('click', sellCargo);
        document.getElementById('undock-btn').addEventListener('click', closeShop);

        function openShop() {
            gameState.shopOpen = true;
            updateShopUI();
            document.getElementById('shop-overlay').classList.add('visible');
        }

        function closeShop() {
            gameState.shopOpen = false;
            gameState.docked = false;
            document.getElementById('shop-overlay').classList.remove('visible');
            gameState.ship.vx = Math.cos(gameState.ship.angle) * 60;
            gameState.ship.vy = Math.sin(gameState.ship.angle) * 60;
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function sellCargo() {
            const ship = gameState.ship;
            if (ship.cargo.length === 0) return;
            let earned = 0;
            const bonus = 1 + gameState.baseUpgrades.sellBonus * 0.15 + gameState.prestige * 0.1;
            const refineryBonus = gameState.baseUpgrades.refinery * 0.2;
            const cargoCount = ship.cargo.length;
            const wasFull = cargoCount >= ship.maxCargo;
            ship.cargo.forEach(item => {
                let mult = bonus;
                if ((item.type === 'platinum' || item.type === 'crystal') && refineryBonus > 0) mult += refineryBonus;
                earned += Math.round(item.value * mult);
            });
            gameState.credits += earned;
            if (!gameState.story.stats.totalCredits) gameState.story.stats.totalCredits = 0;
            gameState.story.stats.totalCredits += earned;
            ship.cargo = [];
            gameState.story.stats.totalSells++;
            checkTransmissions('sell');
            advanceQuest('sell');
            for (let i = 0; i < cargoCount; i++) advanceQuest('sell_count');
            if (wasFull) advanceQuest('sell_full');
            // Check sell_value quest — set progress directly
            for (const [trackId, track] of Object.entries(QUEST_TRACKS)) {
                const qt = gameState.questTracks[trackId];
                if (!qt.unlocked || qt.current >= track.quests.length) continue;
                const quest = track.quests[qt.current];
                if (quest.type === 'sell_value' && earned >= quest.target) {
                    qt.progress = quest.target;
                    gameState.credits += quest.reward;
                    gameState.story.stats.questsCompleted++;
                    gameState.questFlash = 2.5;
                    qt.current++;
                    qt.progress = 0;
                    checkTransmissions('quest_complete');
                }
            }
            checkQuestUnlocks();
            saveGame();
            updateShopUI();
        }

        function getUpgradeCost(key, level) {
            const def = UPGRADE_DEFS.find(d => d.key === key);
            const tier = def ? def.tier : 'basic';
            return UPGRADE_COSTS[tier][level];
        }

        function getUpgradeDetail(key, level) {
            const next = level + 1;
            switch (key) {
                case 'hull': return `HP ${3+level} → ${3+next}`;
                case 'fuel': return `tank ${100+level*25} → ${100+next*25}`;
                case 'cargo': return `slots ${8+level*4} → ${8+next*4}`;
                case 'speed': return `max ${300+level*50} → ${300+next*50}`;
                case 'fireRate': return `delay ${(0.3-level*0.04).toFixed(2)}s → ${(0.3-next*0.04).toFixed(2)}s`;
                case 'thrust': return `accel ${500+level*100} → ${500+next*100}`;
                case 'efficiency': return `drain -${level*15}% → -${next*15}%`;
                case 'turretRate': return `delay ${(0.8-level*0.1).toFixed(1)}s → ${(0.8-next*0.1).toFixed(1)}s`;
                case 'turretRange': return `range ${250+level*100} → ${250+next*100}`;
                case 'scanner': return `+${next*10}% rare drops`;
                case 'density': return `rock spawn +${next*15}%`;
                case 'shield': return `invuln ${(1+level*0.5).toFixed(1)}s → ${(1+next*0.5).toFixed(1)}s`;
                case 'dash': return `cooldown ${(3-level*0.4).toFixed(1)}s → ${(3-next*0.4).toFixed(1)}s`;
                case 'magnet': return `pull ${80+level*40} → ${80+next*40}`;
                case 'piercing': return `pierce ${level} → ${next} targets`;
                case 'salvage': return `+${next} extra drops`;
                case 'telesale': return `auto-sell under ${2+level}cr → ${2+next}cr`;
                default: return '';
            }
        }

        function buyUpgrade(key) {
            const level = gameState.upgrades[key];
            if (level >= 5) return;
            const cost = getUpgradeCost(key, level);
            if (gameState.credits < cost) return;
            gameState.credits -= cost;
            gameState.upgrades[key]++;
            applyUpgrades();
            gameState.ship.hull = Math.min(gameState.ship.hull + (key === 'hull' ? 1 : 0), gameState.ship.maxHull);
            gameState.ship.fuel = gameState.ship.maxFuel;
            advanceQuest('upgrade');
            saveGame();
            updateShopUI();
        }

        function buyBaseUpgrade(key) {
            const def = BASE_UPGRADE_DEFS.find(d => d.key === key);
            const level = gameState.baseUpgrades[key];
            if (level >= 3) return;
            const cost = def.costs[level];
            if (gameState.credits < cost) return;
            gameState.credits -= cost;
            gameState.baseUpgrades[key]++;
            advanceQuest('upgrade');
            saveGame();
            updateShopUI();
        }

        const PRESTIGE_COLORS = ['#58a6ff', '#3fb950', '#f0883e', '#d2a8ff', '#f85149', '#e0e0e0'];

        function canPrestige() {
            const storyTrack = gameState.questTracks.story;
            return storyTrack.unlocked && storyTrack.current >= QUEST_TRACKS.story.quests.length;
        }

        function doPrestige() {
            if (!canPrestige()) return;
            gameState.prestige++;
            gameState.shipColor = PRESTIGE_COLORS[gameState.prestige % PRESTIGE_COLORS.length];
            const keepSeen = [...gameState.story.seen];
            const keepStats = { ...gameState.story.stats };
            gameState.credits = 0;
            for (const k of Object.keys(gameState.upgrades)) gameState.upgrades[k] = 0;
            for (const k of Object.keys(gameState.baseUpgrades)) gameState.baseUpgrades[k] = 0;
            for (const [trackId] of Object.entries(gameState.questTracks)) {
                gameState.questTracks[trackId] = { current: 0, progress: 0, unlocked: false };
            }
            gameState.story.seen = keepSeen;
            gameState.story.stats = keepStats;
            gameState.story.queue = [];
            gameState.story.active = null;
            const ship = gameState.ship;
            ship.x = 0; ship.y = 0; ship.vx = 0; ship.vy = 0;
            ship.hull = 3; ship.fuel = 100;
            ship.cargo = [];
            applyUpgrades();
            checkQuestUnlocks();
            saveGame();
            closeShop();
        }

        function updateShopUI() {
            const ship = gameState.ship;
            document.getElementById('shop-credits').textContent = `CREDITS: ${gameState.credits}${gameState.prestige ? ' ★'.repeat(gameState.prestige) : ''}`;
            document.getElementById('shop-cargo').textContent = `CARGO: ${ship.cargo.length}/${ship.maxCargo}`;
            const bonus = 1 + gameState.baseUpgrades.sellBonus * 0.15 + gameState.prestige * 0.1;
            const sellVal = ship.cargo.reduce((s, i) => s + Math.round(i.value * bonus), 0);
            document.getElementById('sell-btn').textContent = `SELL ALL (${sellVal}cr)`;
            document.getElementById('sell-btn').disabled = ship.cargo.length === 0;

            const breakdown = document.getElementById('cargo-breakdown');
            breakdown.innerHTML = '';
            if (ship.cargo.length > 0) {
                const counts = {};
                ship.cargo.forEach(item => {
                    if (!counts[item.type]) counts[item.type] = { count: 0, value: 0 };
                    counts[item.type].count++;
                    counts[item.type].value += Math.round(item.value * bonus);
                });
                for (const [type, data] of Object.entries(counts)) {
                    const res = RESOURCE_TYPES.find(r => r.name === type);
                    const line = document.createElement('div');
                    line.style.cssText = 'display:flex;justify-content:space-between;padding:2px 0';
                    line.innerHTML = `<span style="color:${res ? res.color : '#8b949e'}">● ${type}</span><span style="color:#8b949e">×${data.count} = ${data.value}cr</span>`;
                    breakdown.appendChild(line);
                }
            }

            const container = document.getElementById('shop-upgrades');
            container.innerHTML = '';
            UPGRADE_DEFS.forEach(def => {
                if (def.reqHull && gameState.upgrades.hull < def.reqHull) return;
                if (def.reqBase && gameState.baseUpgrades[def.reqBase] < 1) return;
                const level = gameState.upgrades[def.key];
                const cost = level < 5 ? getUpgradeCost(def.key, level) : null;
                const pips = '■'.repeat(level) + '□'.repeat(5 - level);
                const detail = level < 5 ? getUpgradeDetail(def.key, level) : '';
                const row = document.createElement('div');
                row.className = 'upgrade-row';
                row.innerHTML = `<span class="upgrade-name">${def.label}</span>` +
                    `<span class="upgrade-pips">${pips}</span>` +
                    `<span style="color:#6e7681;font-size:10px;margin:0 6px">${detail}</span>` +
                    `<span class="upgrade-cost">${cost ? cost + 'cr' : 'MAX'}</span>`;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = 'BUY';
                btn.disabled = !cost || gameState.credits < cost;
                btn.addEventListener('click', () => buyUpgrade(def.key));
                row.appendChild(btn);
                container.appendChild(row);
            });

            const baseContainer = document.getElementById('shop-base-upgrades');
            baseContainer.innerHTML = '';
            BASE_UPGRADE_DEFS.forEach(def => {
                const level = gameState.baseUpgrades[def.key];
                const cost = level < 3 ? def.costs[level] : null;
                const pips = '■'.repeat(level) + '□'.repeat(3 - level);
                const row = document.createElement('div');
                row.className = 'upgrade-row';
                row.innerHTML = `<span class="upgrade-name">${def.label}</span>` +
                    `<span class="upgrade-pips">${pips}</span>` +
                    `<span class="upgrade-cost">${cost ? cost + 'cr' : 'MAX'}</span>`;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = 'BUY';
                btn.disabled = !cost || gameState.credits < cost;
                btn.addEventListener('click', () => buyBaseUpgrade(def.key));
                row.appendChild(btn);
                baseContainer.appendChild(row);
            });

            // Prestige button
            let prestigeBtn = document.getElementById('prestige-btn');
            if (canPrestige()) {
                if (!prestigeBtn) {
                    prestigeBtn = document.createElement('button');
                    prestigeBtn.id = 'prestige-btn';
                    prestigeBtn.className = 'btn';
                    prestigeBtn.style.cssText = 'margin-top:20px;border-color:#d2a8ff;color:#d2a8ff;font-size:0.8rem;width:100%';
                    prestigeBtn.addEventListener('click', () => {
                        if (confirm('NEW CONTRACT: Reset all upgrades and credits for permanent +10% sell bonus. Proceed?')) doPrestige();
                    });
                    baseContainer.parentElement.appendChild(prestigeBtn);
                }
                prestigeBtn.textContent = `★ NEW CONTRACT (Prestige ${gameState.prestige + 1}) ★`;
                prestigeBtn.style.display = '';
            } else if (prestigeBtn) {
                prestigeBtn.style.display = 'none';
            }
        }

        // --- Death ---
        document.getElementById('respawn-btn').addEventListener('click', respawn);

        function die() {
            gameState.dead = true;
            spawnParticles(gameState.ship.x, gameState.ship.y, 20, '#58a6ff', 300);
            const lost = gameState.ship.cargo.length;
            gameState.ship.cargo = [];
            let downgraded = '';
            const upgradeable = Object.keys(gameState.upgrades).filter(k => gameState.upgrades[k] > 0);
            if (upgradeable.length > 0) {
                const key = upgradeable[Math.floor(Math.random() * upgradeable.length)];
                gameState.upgrades[key]--;
                downgraded = UPGRADE_DEFS.find(d => d.key === key).label;
                applyUpgrades();
            }
            let msg = lost > 0 ? `Lost ${lost} cargo.` : 'No cargo lost.';
            if (downgraded) msg += ` ${downgraded} downgraded.`;
            document.getElementById('death-msg').textContent = msg;
            document.getElementById('death-overlay').classList.add('visible');
            gameState.story.stats.totalDeaths++;
            checkTransmissions('death');
            saveGame();
        }

        function respawn() {
            const ship = gameState.ship;
            gameState.dead = false;
            ship.x = 0; ship.y = 0;
            ship.vx = 0; ship.vy = 0;
            ship.hull = ship.maxHull;
            ship.fuel = ship.maxFuel;
            ship.invulnTimer = 3;
            gameState.rocks = [];
            gameState.enemies = [];
            gameState.enemyBullets = [];
            document.getElementById('death-overlay').classList.remove('visible');
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // --- Rescue (out of fuel) ---
        document.getElementById('rescue-btn').addEventListener('click', startRescue);

        function triggerRescue() {
            gameState.stranded = true;
            const ship = gameState.ship;
            const cargoCount = ship.cargo.length;
            ship.cargo = [];
            const fee = gameState.credits < 5 ? gameState.credits : Math.max(5, Math.floor(gameState.credits * 0.25));
            gameState.credits -= fee;
            let msg = cargoCount > 0 ? `${cargoCount} cargo dumped for tow.` : 'No cargo to dump.';
            msg += fee > 0 ? ` Rescue fee: ${fee} CR.` : '';
            document.getElementById('rescue-msg').textContent = msg;
            document.getElementById('rescue-overlay').classList.add('visible');
            saveGame();
        }

        function startRescue() {
            document.getElementById('rescue-overlay').classList.remove('visible');
            gameState.stranded = false;
            gameState.rescued = true;
            const ship = gameState.ship;
            const angleToBase = Math.atan2(-ship.y, -ship.x);
            const approachAngle = angleToBase + Math.PI;
            gameState.rescueTug = {
                x: ship.x + Math.cos(approachAngle) * 400,
                y: ship.y + Math.sin(approachAngle) * 400,
                angle: angleToBase,
                attached: false
            };
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function updateRescue(dt) {
            const ship = gameState.ship;
            const tug = gameState.rescueTug;
            if (!tug) return;

            if (!tug.attached) {
                const dx = ship.x - tug.x;
                const dy = ship.y - tug.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                tug.angle = Math.atan2(dy, dx);
                if (dist < 30) {
                    tug.attached = true;
                } else {
                    const speed = 300;
                    tug.x += Math.cos(tug.angle) * speed * dt;
                    tug.y += Math.sin(tug.angle) * speed * dt;
                }
            } else {
                const dx = -tug.x;
                const dy = -tug.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 50) {
                    completeRescue();
                    return;
                }
                const angle = Math.atan2(dy, dx);
                tug.angle = angle;
                const speed = 500;
                tug.x += Math.cos(angle) * speed * dt;
                tug.y += Math.sin(angle) * speed * dt;
                ship.x = tug.x - Math.cos(angle) * 40;
                ship.y = tug.y - Math.sin(angle) * 40;
                ship.angle = angle;
                ship.vx = 0; ship.vy = 0;
            }
            gameState.camera.x = ship.x;
            gameState.camera.y = ship.y;
        }

        function completeRescue() {
            const ship = gameState.ship;
            ship.x = 0; ship.y = 0;
            ship.vx = 0; ship.vy = 0;
            ship.fuel = ship.maxFuel;
            ship.hull = ship.maxHull;
            ship.invulnTimer = 3;
            gameState.rescued = false;
            gameState.rescueTug = null;
            gameState.rocks = [];
            gameState.camera.x = 0;
            gameState.camera.y = 0;
            saveGame();
        }

        // --- Rock generation ---
        function generateRockVertices(radius, typeName) {
            let count;
            if (typeName === 'gold') {
                count = 5 + Math.floor(Math.random() * 2);
            } else {
                count = 7 + Math.floor(Math.random() * 5);
            }
            const verts = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                let dist;
                if (typeName === 'gold') {
                    dist = radius * (i % 2 === 0 ? 1.0 : 0.55);
                } else {
                    dist = radius * (0.7 + Math.random() * 0.3);
                }
                verts.push({ angle, dist });
            }
            return verts;
        }

        function spawnRock(x, y, tier, resourceTypeOverride) {
            const t = ROCK_TIERS[tier];
            const distFromOrigin = Math.sqrt(x * x + y * y);
            const driftScale = 1 + distFromOrigin / 3000;
            const angle = Math.random() * Math.PI * 2;
            const speed = ROCK_DRIFT_BASE * driftScale * (0.5 + Math.random());
            const resourceType = resourceTypeOverride || pickResource(distFromOrigin);
            gameState.rocks.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 2,
                tier, radius: t.radius, hp: t.hp * (1 + Math.floor(distFromOrigin / 6000)),
                resourceType,
                vertices: generateRockVertices(t.radius, resourceType.name)
            });
        }

        function pickTier(dist) {
            const r = Math.random();
            if (dist > 3000) return r < 0.5 ? 'large' : r < 0.8 ? 'medium' : 'small';
            if (dist > 1500) return r < 0.3 ? 'large' : r < 0.7 ? 'medium' : 'small';
            if (dist > 500) return r < 0.1 ? 'large' : r < 0.4 ? 'medium' : 'small';
            return r < 0.2 ? 'medium' : 'small';
        }

        function getTargetRockCount() {
            const dist = Math.sqrt(gameState.ship.x ** 2 + gameState.ship.y ** 2);
            const densityBonus = gameState.upgrades.density * 3;
            return Math.min(ROCK_BASE_DENSITY + densityBonus + Math.floor(dist / 200), ROCK_MAX_COUNT + densityBonus);
        }

        // --- Particles ---
        function spawnParticles(x, y, count, color, speed) {
            for (let i = 0; i < count && gameState.particles.length < PARTICLE_MAX; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = speed * (0.3 + Math.random() * 0.7);
                gameState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 0.4 + Math.random() * 0.4,
                    maxLife: 0.8,
                    color, size: 2 + Math.random() * 2
                });
            }
        }

        // --- Resource drops ---
        function pickResource(dist) {
            const scannerLevel = gameState.upgrades.scanner;
            const effectiveDist = dist + scannerLevel * 600;
            const available = RESOURCE_TYPES.filter(r => effectiveDist >= r.minDist);
            const bias = 1 + scannerLevel * 0.3;
            const weights = available.map((r, i) => Math.pow(bias, i));
            const total = weights.reduce((s, w) => s + w, 0);
            let roll = Math.random() * total;
            for (let i = 0; i < available.length; i++) {
                roll -= weights[i];
                if (roll <= 0) return available[i];
            }
            return available[available.length - 1];
        }

        function dropResources(rock) {
            const count = rock.tier === 'large' ? 3 : rock.tier === 'medium' ? 2 : 1;
            for (let i = 0; i < count; i++) {
                const type = rock.resourceType;
                const offset = 20;
                gameState.resources.push({
                    x: rock.x + (Math.random() - 0.5) * offset,
                    y: rock.y + (Math.random() - 0.5) * offset,
                    type: type.name, color: type.color, value: type.value,
                    life: RESOURCE_LIFETIME,
                    bobPhase: Math.random() * Math.PI * 2
                });
            }
        }

        // --- Auto-aim ---
        function findNearestTarget(range) {
            const ship = gameState.ship;
            let nearest = null, minDist = range;
            for (const enemy of gameState.enemies) {
                const dx = enemy.x - ship.x, dy = enemy.y - ship.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < minDist) { minDist = d; nearest = enemy; }
            }
            if (nearest) return nearest;
            for (const rock of gameState.rocks) {
                const dx = rock.x - ship.x, dy = rock.y - ship.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < minDist) { minDist = d; nearest = rock; }
            }
            return nearest;
        }

        // --- Update functions ---
        function updateShip(dt) {
            const ship = gameState.ship;
            const derived = gameState.derived;

            if (gameState.isMobile && gameState.joystick.active) {
                ship.angle = -gameState.joystick.angle;
                ship.thrust = gameState.joystick.force;
            } else if (!gameState.isMobile) {
                let mx = 0, my = 0;
                if (gameState.keys['ArrowLeft'] || gameState.keys['KeyA']) mx -= 1;
                if (gameState.keys['ArrowRight'] || gameState.keys['KeyD']) mx += 1;
                if (gameState.keys['ArrowUp'] || gameState.keys['KeyW']) my -= 1;
                if (gameState.keys['ArrowDown'] || gameState.keys['KeyS']) my += 1;
                if (mx !== 0 || my !== 0) {
                    ship.angle = Math.atan2(my, mx);
                    ship.thrust = 1;
                } else {
                    ship.thrust = 0;
                }
            } else {
                ship.thrust = 0;
            }

            if (ship.thrust > 0 && ship.fuel > 0) {
                const prevPct = ship.fuel / ship.maxFuel;
                const currentDist2 = Math.sqrt(ship.x * ship.x + ship.y * ship.y);
                const fuelRate = (FUEL_DRAIN_RATE + currentDist2 / 5000) * gameState.derived.fuelMult;
                ship.fuel -= fuelRate * ship.thrust * dt;
                if (ship.fuel < 0) ship.fuel = 0;
                const newPct = ship.fuel / ship.maxFuel;
                if (prevPct > 0.5 && newPct <= 0.5) {
                    gameState.fuelWarnFlash = 2; gameState.fuelWarnMsg = 'HALF FUEL';
                } else if (prevPct > 0.2 && newPct <= 0.2) {
                    gameState.fuelWarnFlash = 2.5; gameState.fuelWarnMsg = 'LOW FUEL';
                }
                ship.vx += Math.cos(ship.angle) * derived.accel * ship.thrust * dt;
                ship.vy += Math.sin(ship.angle) * derived.accel * ship.thrust * dt;
                if (gameState.particles.length < PARTICLE_MAX && Math.random() < 0.6) {
                    const bx = ship.x - Math.cos(ship.angle) * ship.size * 0.5;
                    const by = ship.y - Math.sin(ship.angle) * ship.size * 0.5;
                    gameState.particles.push({
                        x: bx, y: by,
                        vx: -Math.cos(ship.angle) * 80 + (Math.random() - 0.5) * 40,
                        vy: -Math.sin(ship.angle) * 80 + (Math.random() - 0.5) * 40,
                        life: 0.2 + Math.random() * 0.15, maxLife: 0.35,
                        color: '#f0883e', size: 2
                    });
                }
            } else if (ship.fuel <= 0) {
                ship.thrust = 0;
                ship.invulnTimer = Infinity;
            }

            // Dash ability
            if (ship.dashCooldown > 0) ship.dashCooldown -= dt;
            if (derived.dashCooldown > 0 && gameState.keys['ShiftLeft'] && ship.dashCooldown <= 0 && ship.thrust > 0 && ship.fuel > 0) {
                ship.vx += Math.cos(ship.angle) * 600;
                ship.vy += Math.sin(ship.angle) * 600;
                ship.dashCooldown = derived.dashCooldown;
                ship.fuel -= 5;
                spawnParticles(ship.x, ship.y, 8, '#58a6ff', 100);
            }

            const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
            if (ship.fuel <= 0 && speed < 5 && !gameState.stranded && !gameState.dead && !gameState.docked) {
                triggerRescue();
                return;
            }
            if (speed > derived.maxSpeed) {
                ship.vx = (ship.vx / speed) * derived.maxSpeed;
                ship.vy = (ship.vy / speed) * derived.maxSpeed;
            }

            ship.vx *= SHIP_DRAG;
            ship.vy *= SHIP_DRAG;
            ship.x += ship.vx * dt;
            ship.y += ship.vy * dt;

            gameState.camera.x = ship.x;
            gameState.camera.y = ship.y;

            if (ship.invulnTimer > 0) ship.invulnTimer -= dt;
            if (gameState.cargoFullFlash > 0) gameState.cargoFullFlash -= dt;
            if (gameState.fuelWarnFlash > 0) gameState.fuelWarnFlash -= dt;
            if (gameState.questFlash > 0) gameState.questFlash -= dt;

            const currentDist = Math.sqrt(ship.x * ship.x + ship.y * ship.y);
            if (currentDist > gameState.tripStats.maxDist) gameState.tripStats.maxDist = currentDist;
            if (currentDist > gameState.story.stats.maxDist) {
                gameState.story.stats.maxDist = currentDist;
                checkTransmissions('distance');
                advanceQuest('distance');
                checkQuestUnlocks();
            }
            updateTransmission(dt);
        }

        function updateShooting(dt) {
            const ship = gameState.ship;

            // --- Auto turret (always active) ---
            ship.turretTimer -= dt;
            if (ship.turretTimer <= 0) {
                const turretRange = 300 + gameState.upgrades.turretRange * 100;
                const target = findNearestTarget(turretRange);
                if (target) {
                    const angle = Math.atan2(target.y - ship.y, target.x - ship.x);
                    ship.turretTimer = 0.8 / (1 + gameState.upgrades.turretRate * 0.3);
                    gameState.bullets.push({
                        x: ship.x + Math.cos(angle) * ship.size,
                        y: ship.y + Math.sin(angle) * ship.size,
                        vx: Math.cos(angle) * BULLET_SPEED + ship.vx * 0.3,
                        vy: Math.sin(angle) * BULLET_SPEED + ship.vy * 0.3,
                        life: BULLET_LIFETIME * 0.6,
                        angle, turret: true
                    });
                } else {
                    ship.turretTimer = 0.1;
                }
            }

            // --- Manual gun (player-aimed) ---
            ship.fireTimer -= dt;
            let shouldFire = false;
            let fireAngle = ship.angle;

            if (gameState.isMobile) {
                if (gameState.aimJoystick.active) {
                    shouldFire = true;
                    fireAngle = -gameState.aimJoystick.angle;
                }
            } else {
                if (gameState.mouse.down || gameState.keys['Space']) {
                    shouldFire = true;
                    if (gameState.mouse.down) {
                        fireAngle = Math.atan2(
                            gameState.mouse.y - canvas.height / 2,
                            gameState.mouse.x - canvas.width / 2
                        );
                    } else {
                        const target = findNearestTarget(AUTOAIM_RANGE);
                        if (target) fireAngle = Math.atan2(target.y - ship.y, target.x - ship.x);
                    }
                }
            }

            if (shouldFire && ship.fireTimer <= 0) {
                ship.fireTimer = gameState.derived.fireRate;
                gameState.bullets.push({
                    x: ship.x + Math.cos(fireAngle) * ship.size,
                    y: ship.y + Math.sin(fireAngle) * ship.size,
                    vx: Math.cos(fireAngle) * BULLET_SPEED + ship.vx * 0.3,
                    vy: Math.sin(fireAngle) * BULLET_SPEED + ship.vy * 0.3,
                    life: BULLET_LIFETIME,
                    angle: fireAngle, turret: false
                });
            }
        }

        function updateBullets(dt) {
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const b = gameState.bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;
                if (b.life <= 0) gameState.bullets.splice(i, 1);
            }
        }

        function updateRocks(dt) {
            const ship = gameState.ship;
            const defenseLevel = gameState.baseUpgrades.defense;

            for (let i = gameState.rocks.length - 1; i >= 0; i--) {
                const rock = gameState.rocks[i];
                rock.x += rock.vx * dt;
                rock.y += rock.vy * dt;
                rock.rotation += rock.rotSpeed * dt;

                const dx = rock.x - ship.x, dy = rock.y - ship.y;
                if (dx * dx + dy * dy > ROCK_DESPAWN_RADIUS * ROCK_DESPAWN_RADIUS) {
                    gameState.rocks.splice(i, 1);
                    continue;
                }

                if (defenseLevel > 0) {
                    const distToBase = Math.sqrt(rock.x * rock.x + rock.y * rock.y);
                    if (distToBase < getSafeRadius() * 0.8) {
                        spawnParticles(rock.x, rock.y, 6, rock.resourceType.color, 100);
                        dropResources(rock);
                        gameState.rocks.splice(i, 1);
                    }
                }
            }

            const target = getTargetRockCount();
            let attempts = 0;
            while (gameState.rocks.length < target && attempts < 5) {
                attempts++;
                const angle = Math.random() * Math.PI * 2;
                const dist = 800 + Math.random() * 400;
                const sx = ship.x + Math.cos(angle) * dist;
                const sy = ship.y + Math.sin(angle) * dist;
                const distToBase = Math.sqrt(sx * sx + sy * sy);
                if (distToBase < getSafeRadius()) continue;
                const distFromOrigin = Math.sqrt(sx * sx + sy * sy);
                const tier = pickTier(distFromOrigin);
                spawnRock(sx, sy, tier);
                if (distFromOrigin >= 1500 && (tier === 'large' || tier === 'medium') && Math.random() < 0.15) {
                    const newRock = gameState.rocks[gameState.rocks.length - 1];
                    spawnEnemy('turret', sx, sy, newRock);
                }
            }
        }

        function updateParticles(dt) {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) gameState.particles.splice(i, 1);
            }
        }

        function updateResources(dt) {
            const ship = gameState.ship;
            const magnetRange = gameState.upgrades.magnet > 0 ? 50 + gameState.upgrades.magnet * 30 : 0;
            const baseMagnet = gameState.baseUpgrades.defense >= 2;
            for (let i = gameState.resources.length - 1; i >= 0; i--) {
                const r = gameState.resources[i];
                r.life -= dt;
                r.bobPhase += dt * 3;

                const dx = r.x - ship.x, dy = r.y - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (r.life <= 0 || dx * dx + dy * dy > ROCK_DESPAWN_RADIUS * ROCK_DESPAWN_RADIUS) {
                    gameState.resources.splice(i, 1);
                    continue;
                }

                if (baseMagnet) {
                    const bdx = r.x, bdy = r.y;
                    const bDist = Math.sqrt(bdx * bdx + bdy * bdy);
                    if (bDist < getSafeRadius() && bDist > 20) {
                        r.x -= (bdx / bDist) * 60 * dt;
                        r.y -= (bdy / bDist) * 60 * dt;
                    }
                }

                if (magnetRange > 0 && dist < magnetRange && dist > RESOURCE_COLLECT_RADIUS) {
                    const pullSpeed = 100;
                    r.x -= (dx / dist) * pullSpeed * dt;
                    r.y -= (dy / dist) * pullSpeed * dt;
                }

                if (dist < RESOURCE_COLLECT_RADIUS) {
                    const telesaleThreshold = [0, 2, 5, 12, 25, 60][gameState.upgrades.telesale];
                    if (telesaleThreshold > 0 && r.value <= telesaleThreshold) {
                        gameState.credits += r.value;
                        spawnParticles(r.x, r.y, 4, '#e3b341', 40);
