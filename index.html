<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <title>Asteroids Miner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d1117;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #pause-overlay, #shop-overlay, #death-overlay, #rescue-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            overflow-y: auto;
            padding: 20px;
        }
        #pause-overlay.visible, #shop-overlay.visible, #death-overlay.visible, #rescue-overlay.visible {
            display: flex;
        }
        #pause-overlay h1, #shop-overlay h1, #death-overlay h1, #rescue-overlay h1 {
            font-family: 'Courier New', monospace;
            color: #58a6ff;
            font-size: 2.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        #death-overlay h1 { color: #f85149; }
        #rescue-overlay h1 { color: #f0883e; }
        #pause-overlay p, #shop-overlay p, #death-overlay p, #rescue-overlay p {
            font-family: 'Courier New', monospace;
            color: #8b949e;
            font-size: 1rem;
        }
        .btn {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            padding: 10px 28px;
            background: transparent;
            border: 2px solid #58a6ff;
            color: #58a6ff;
            cursor: pointer;
            letter-spacing: 2px;
            transition: background 0.2s, color 0.2s;
        }
        .btn:hover { background: #58a6ff; color: #0d1117; }
        .btn:disabled { opacity: 0.3; cursor: default; border-color: #8b949e; color: #8b949e; }
        .btn:disabled:hover { background: transparent; color: #8b949e; }
        .btn-sell { border-color: #3fb950; color: #3fb950; }
        .btn-sell:hover { background: #3fb950; color: #0d1117; }
        #pause-button {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            width: 44px;
            height: 44px;
            background: transparent;
            border: 2px solid #8b949e;
            color: #8b949e;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        #joystick-zone {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            z-index: 50;
        }
        #fire-button {
            display: none;
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #f85149;
            color: #f85149;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 50;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        #dock-button {
            display: none;
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            z-index: 60;
            font-size: 1.2rem;
            padding: 12px 32px;
        }
        #dock-button.visible { display: block; }
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d1117;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #rotate-overlay span { font-size: 3rem; }
        #rotate-overlay p { font-family: 'Courier New', monospace; color: #8b949e; font-size: 1rem; }
        @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
            #rotate-overlay { display: flex; }
        }
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            align-items: center;
        }
        .settings-group label {
            font-family: 'Courier New', monospace;
            color: #8b949e;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .settings-row {
            display: flex;
            gap: 8px;
        }
        .settings-row button {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            padding: 5px 12px;
            background: transparent;
            border: 1px solid #8b949e;
            color: #8b949e;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .settings-row button.active { border-color: #58a6ff; color: #58a6ff; }
        .shop-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .upgrade-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .upgrade-name { color: #c9d1d9; min-width: 80px; }
        .upgrade-pips { letter-spacing: 2px; }
        .upgrade-cost { color: #3fb950; min-width: 50px; text-align: right; }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <button id="pause-button">&#10074;&#10074;</button>
    <div id="pause-overlay">
        <h1>Paused</h1>
        <p>Asteroids Miner</p>
        <div class="settings-group" id="mobile-settings" style="display:none">
            <label>Joystick Side</label>
            <div class="settings-row" id="joystick-side-btns">
                <button data-value="left" class="active">Left</button>
                <button data-value="right">Right</button>
            </div>
            <label>Joystick Mode</label>
            <div class="settings-row" id="joystick-mode-btns">
                <button data-value="static" class="active">Fixed</button>
                <button data-value="semi">Semi</button>
                <button data-value="dynamic">Float</button>
            </div>
        </div>
        <button class="btn" id="resume-btn">Resume</button>
        <button class="btn" id="cheat-btn" style="margin-top:20px;border-color:#3fb950;color:#3fb950;font-size:0.7rem">$$$ CHEAT $$$</button>
        <button class="btn" id="reset-btn" style="margin-top:8px;border-color:#f85149;color:#f85149;font-size:0.7rem">RESET SAVE</button>
    </div>
    <div id="shop-overlay">
        <h1>Home Base</h1>
        <p id="shop-credits">CREDITS: 0</p>
        <p id="shop-cargo">CARGO: 0/8</p>
        <button class="btn btn-sell" id="sell-btn">SELL ALL</button>
        <div class="shop-section" id="shop-upgrades"></div>
        <p style="color:#3fb950;margin-top:12px;font-family:'Courier New',monospace;font-size:0.9rem">— BASE —</p>
        <div class="shop-section" id="shop-base-upgrades"></div>
        <button class="btn" id="undock-btn">UNDOCK</button>
    </div>
    <div id="death-overlay">
        <h1>Destroyed</h1>
        <p id="death-msg">Cargo lost. Hull downgraded.</p>
        <button class="btn" id="respawn-btn">RESPAWN</button>
    </div>
    <div id="rescue-overlay">
        <h1>OUT OF FUEL</h1>
        <p id="rescue-msg">Cargo dumped. Rescue fee: 5 CR.</p>
        <button class="btn" id="rescue-btn">RESCUE ME</button>
    </div>
    <div id="rotate-overlay">
        <span>&#x21BB;</span>
        <p>Rotate to landscape</p>
    </div>
    <button id="dock-button" class="btn btn-sell">DOCK</button>
    <div id="joystick-zone"></div>
    <button id="fire-button">FIRE</button>

    <script src="https://unpkg.com/nipplejs@0.10.2/dist/nipplejs.js"></script>
    <script>
    (function() {
        'use strict';

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Constants ---
        const SHIP_ACCEL = 400;
        const SHIP_MAX_SPEED = 350;
        const SHIP_DRAG = 0.98;
        const SHIP_SIZE = 18;
        const BULLET_SPEED = 600;
        const BULLET_LIFETIME = 1.2;
        const BULLET_LENGTH = 12;
        const FIRE_RATE_BASE = 0.25;
        const AUTOAIM_RANGE = 400;
        const ROCK_ACTIVE_RADIUS = 1200;
        const ROCK_DESPAWN_RADIUS = 1500;
        const ROCK_BASE_DENSITY = 6;
        const ROCK_MAX_COUNT = 30;
        const ROCK_DRIFT_BASE = 30;
        const RESOURCE_COLLECT_RADIUS = 35;
        const RESOURCE_LIFETIME = 30;
        const FUEL_DRAIN_RATE = 8;
        const COLLISION_DAMAGE = 1;
        const INVULN_TIME = 1.5;
        const BASE_DOCK_RADIUS = 60;
        const BASE_DOCK_SPEED = 40;
        const BASE_SAFE_RADIUS = 300;
        const UPGRADE_COSTS = [10, 30, 75, 150, 300];
        const STAR_COUNT = 200;
        const STAR_FIELD_SIZE = 2000;
        const PARTICLE_MAX = 120;

        const ROCK_TIERS = {
            large:  { radius: 40, hp: 3, children: 2, childTier: 'medium' },
            medium: { radius: 24, hp: 2, children: 2, childTier: 'small' },
            small:  { radius: 14, hp: 1, children: 0, childTier: null }
        };

        const RESOURCE_TYPES = [
            { name: 'iron',     color: '#8b949e', minDist: 0,    value: 2 },
            { name: 'copper',   color: '#f0883e', minDist: 500,  value: 5 },
            { name: 'gold',     color: '#d2a8ff', minDist: 1500, value: 12 },
            { name: 'platinum', color: '#58a6ff', minDist: 3000, value: 25 },
            { name: 'crystal',  color: '#3fb950', minDist: 5000, value: 60 }
        ];

        const UPGRADE_DEFS = [
            { key: 'hull',     label: 'HULL',      desc: '+1 max HP' },
            { key: 'fuel',     label: 'FUEL',      desc: '+25 tank' },
            { key: 'cargo',    label: 'CARGO',     desc: '+4 slots' },
            { key: 'speed',    label: 'SPEED',     desc: '+50 max' },
            { key: 'fireRate', label: 'FIRE RATE', desc: 'faster' },
            { key: 'thrust',   label: 'THRUST',    desc: '+100 accel' },
            { key: 'scanner',  label: 'SCANNER',   desc: 'better drops' },
            { key: 'density',  label: 'DENSITY',   desc: 'more rocks' },
            { key: 'magnet',   label: 'MAGNET',    desc: 'pull resources' }
        ];

        const BASE_UPGRADE_DEFS = [
            { key: 'sellBonus', label: 'TRADE HUB', desc: '+15% sell', costs: [50, 150, 400] },
            { key: 'defense',   label: 'DEFENSE',   desc: 'auto-destroy + magnet', costs: [75, 200, 500] }
        ];

        // --- Game State ---
        const gameState = {
            paused: false,
            shopOpen: false,
            dead: false,
            ship: {
                x: 0, y: 0,
                angle: -Math.PI / 2,
                vx: 0, vy: 0,
                thrust: 0,
                size: SHIP_SIZE,
                hull: 3, maxHull: 3,
                fuel: 100, maxFuel: 100,
                cargo: [], maxCargo: 8,
                fireTimer: 0,
                invulnTimer: 0
            },
            camera: { x: 0, y: 0 },
            base: { x: 0, y: 0, radius: BASE_DOCK_RADIUS, pulse: 0 },
            bullets: [],
            rocks: [],
            particles: [],
            resources: [],
            stars: [],
            keys: {},
            mouse: { x: 0, y: 0, down: false },
            joystick: { active: false, angle: 0, force: 0 },
            isMobile: false,
            lastTime: 0,
            credits: 0,
            upgrades: { hull: 0, fuel: 0, cargo: 0, speed: 0, fireRate: 0, thrust: 0, scanner: 0, density: 0, magnet: 0 },
            baseUpgrades: { sellBonus: 0, defense: 0 },
            derived: { maxSpeed: SHIP_MAX_SPEED, fireRate: FIRE_RATE_BASE, accel: SHIP_ACCEL },
            settings: { joystickSide: 'left', joystickMode: 'static' },
            docked: false,
            cargoFullFlash: 0,
            stranded: false,
            rescued: false,
            rescueTug: null,
            fuelWarnFlash: 0,
            fuelWarnMsg: ''
        };

        function applyUpgrades() {
            const u = gameState.upgrades;
            const ship = gameState.ship;
            ship.maxHull = 3 + u.hull;
            ship.maxFuel = 100 + u.fuel * 25;
            ship.maxCargo = 8 + u.cargo * 4;
            gameState.derived = {
                maxSpeed: SHIP_MAX_SPEED + u.speed * 50,
                fireRate: FIRE_RATE_BASE * Math.pow(0.8, u.fireRate),
                accel: SHIP_ACCEL + u.thrust * 100
            };
        }

        function saveGame() {
            try {
                localStorage.setItem('asteroids-save', JSON.stringify({
                    upgrades: gameState.upgrades,
                    baseUpgrades: gameState.baseUpgrades,
                    credits: gameState.credits
                }));
            } catch(e) {}
        }

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem('asteroids-save'));
                if (saved) {
                    Object.assign(gameState.upgrades, saved.upgrades);
                    if (saved.baseUpgrades) Object.assign(gameState.baseUpgrades, saved.baseUpgrades);
                    gameState.credits = saved.credits || 0;
                    applyUpgrades();
                    gameState.ship.hull = gameState.ship.maxHull;
                    gameState.ship.fuel = gameState.ship.maxFuel;
                }
            } catch(e) {}
        }

        // --- Stars ---
        function generateStars() {
            gameState.stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                gameState.stars.push({
                    x: (Math.random() - 0.5) * STAR_FIELD_SIZE,
                    y: (Math.random() - 0.5) * STAR_FIELD_SIZE,
                    size: Math.random() * 1.5 + 0.5,
                    brightness: Math.random() * 0.5 + 0.3,
                    layer: Math.random() < 0.3 ? 0.3 : Math.random() < 0.6 ? 0.6 : 1
                });
            }
        }
        generateStars();

        // --- Mobile ---
        function detectMobile() {
            gameState.isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (gameState.isMobile) {
                document.getElementById('fire-button').style.display = 'flex';
                document.getElementById('mobile-settings').style.display = 'flex';
                try { screen.orientation.lock('landscape'); } catch(e) {}
                loadSettings();
                setupJoystick();
            }
        }

        function loadSettings() {
            try {
                const saved = localStorage.getItem('asteroids-settings');
                if (saved) Object.assign(gameState.settings, JSON.parse(saved));
            } catch(e) {}
            syncSettingsUI();
        }

        function saveSettings() {
            try { localStorage.setItem('asteroids-settings', JSON.stringify(gameState.settings)); } catch(e) {}
        }

        function syncSettingsUI() {
            document.querySelectorAll('#joystick-side-btns button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === gameState.settings.joystickSide);
            });
            document.querySelectorAll('#joystick-mode-btns button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.value === gameState.settings.joystickMode);
            });
        }

        let joystickManager = null;
        function setupJoystick() {
            if (typeof nipplejs === 'undefined') return;
            if (joystickManager) { joystickManager.destroy(); joystickManager = null; }

            const zone = document.getElementById('joystick-zone');
            const side = gameState.settings.joystickSide;
            const mode = gameState.settings.joystickMode;

            zone.style.left = side === 'left' ? '0' : 'auto';
            zone.style.right = side === 'right' ? '0' : 'auto';

            const fireBtn = document.getElementById('fire-button');
            fireBtn.style.left = side === 'right' ? '40px' : 'auto';
            fireBtn.style.right = side === 'left' ? '40px' : 'auto';

            const opts = { zone, mode, color: '#58a6ff', size: 120 };
            if (mode === 'static') {
                opts.position = side === 'left' ? { left: '100px', bottom: '100px' } : { right: '100px', bottom: '100px' };
            }
            if (mode === 'semi') opts.catchDistance = 150;

            joystickManager = nipplejs.create(opts);
            joystickManager.on('move', function(evt, data) {
                gameState.joystick.active = true;
                gameState.joystick.angle = data.angle.radian;
                gameState.joystick.force = Math.min(data.force / 2, 1);
            });
            joystickManager.on('end', function() {
                gameState.joystick.active = false;
                gameState.joystick.force = 0;
            });
        }

        // --- Input ---
        window.addEventListener('keydown', (e) => {
            gameState.keys[e.code] = true;
            if (e.code === 'Escape') togglePause();
        });
        window.addEventListener('keyup', (e) => { gameState.keys[e.code] = false; });
        canvas.addEventListener('mousemove', (e) => {
            gameState.mouse.x = e.clientX;
            gameState.mouse.y = e.clientY;
        });
        canvas.addEventListener('mousedown', () => { gameState.mouse.down = true; });
        canvas.addEventListener('mouseup', () => { gameState.mouse.down = false; });

        document.getElementById('pause-button').addEventListener('click', togglePause);
        document.getElementById('resume-btn').addEventListener('click', togglePause);
        document.getElementById('cheat-btn').addEventListener('click', function() {
            gameState.credits += 99999;
            saveGame();
        });
        document.getElementById('reset-btn').addEventListener('click', function() {
            if (confirm('Reset all progress?')) {
                localStorage.removeItem('asteroids-save');
                location.reload();
            }
        });
        document.getElementById('joystick-side-btns').addEventListener('click', function(e) {
            if (!e.target.dataset.value) return;
            gameState.settings.joystickSide = e.target.dataset.value;
            saveSettings(); syncSettingsUI(); setupJoystick();
        });
        document.getElementById('joystick-mode-btns').addEventListener('click', function(e) {
            if (!e.target.dataset.value) return;
            gameState.settings.joystickMode = e.target.dataset.value;
            saveSettings(); syncSettingsUI(); setupJoystick();
        });

        let fireButtonDown = false;
        const fireBtn = document.getElementById('fire-button');
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireButtonDown = true; });
        fireBtn.addEventListener('touchend', () => { fireButtonDown = false; });

        function togglePause() {
            if (gameState.shopOpen || gameState.dead || gameState.stranded || gameState.rescued) return;
            gameState.paused = !gameState.paused;
            document.getElementById('pause-overlay').classList.toggle('visible', gameState.paused);
            if (!gameState.paused) {
                gameState.lastTime = performance.now();
                requestAnimationFrame(gameLoop);
            }
        }

        // --- Docking ---
        document.getElementById('dock-button').addEventListener('click', function() {
            const ship = gameState.ship;
            gameState.docked = true;
            ship.fuel = ship.maxFuel;
            ship.hull = ship.maxHull;
            ship.invulnTimer = 0;
            ship.vx = 0; ship.vy = 0;
            spawnParticles(ship.x, ship.y, 15, '#58a6ff', 100);
            spawnParticles(ship.x, ship.y, 10, '#3fb950', 80);
            document.getElementById('dock-button').classList.remove('visible');
            openShop();
        });

        // --- Shop ---
        document.getElementById('sell-btn').addEventListener('click', sellCargo);
        document.getElementById('undock-btn').addEventListener('click', closeShop);

        function openShop() {
            gameState.shopOpen = true;
            updateShopUI();
            document.getElementById('shop-overlay').classList.add('visible');
        }

        function closeShop() {
            gameState.shopOpen = false;
            gameState.docked = false;
            document.getElementById('shop-overlay').classList.remove('visible');
            gameState.ship.vx = Math.cos(gameState.ship.angle) * 60;
            gameState.ship.vy = Math.sin(gameState.ship.angle) * 60;
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function sellCargo() {
            const ship = gameState.ship;
            let earned = 0;
            const bonus = 1 + gameState.baseUpgrades.sellBonus * 0.15;
            ship.cargo.forEach(item => { earned += Math.round(item.value * bonus); });
            gameState.credits += earned;
            ship.cargo = [];
            saveGame();
            updateShopUI();
        }

        function buyUpgrade(key) {
            const level = gameState.upgrades[key];
            if (level >= 5) return;
            const cost = UPGRADE_COSTS[level];
            if (gameState.credits < cost) return;
            gameState.credits -= cost;
            gameState.upgrades[key]++;
            applyUpgrades();
            gameState.ship.hull = Math.min(gameState.ship.hull + (key === 'hull' ? 1 : 0), gameState.ship.maxHull);
            gameState.ship.fuel = gameState.ship.maxFuel;
            saveGame();
            updateShopUI();
        }

        function buyBaseUpgrade(key) {
            const def = BASE_UPGRADE_DEFS.find(d => d.key === key);
            const level = gameState.baseUpgrades[key];
            if (level >= 3) return;
            const cost = def.costs[level];
            if (gameState.credits < cost) return;
            gameState.credits -= cost;
            gameState.baseUpgrades[key]++;
            saveGame();
            updateShopUI();
        }

        function updateShopUI() {
            const ship = gameState.ship;
            document.getElementById('shop-credits').textContent = `CREDITS: ${gameState.credits}`;
            document.getElementById('shop-cargo').textContent = `CARGO: ${ship.cargo.length}/${ship.maxCargo}`;
            const sellVal = ship.cargo.reduce((s, i) => s + i.value, 0);
            document.getElementById('sell-btn').textContent = `SELL ALL (${sellVal}cr)`;
            document.getElementById('sell-btn').disabled = ship.cargo.length === 0;

            const container = document.getElementById('shop-upgrades');
            container.innerHTML = '';
            UPGRADE_DEFS.forEach(def => {
                const level = gameState.upgrades[def.key];
                const cost = level < 5 ? UPGRADE_COSTS[level] : null;
                const pips = '■'.repeat(level) + '□'.repeat(5 - level);
                const row = document.createElement('div');
                row.className = 'upgrade-row';
                row.innerHTML = `<span class="upgrade-name">${def.label}</span>` +
                    `<span class="upgrade-pips">${pips}</span>` +
                    `<span class="upgrade-cost">${cost ? cost + 'cr' : 'MAX'}</span>`;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = 'BUY';
                btn.disabled = !cost || gameState.credits < cost;
                btn.addEventListener('click', () => buyUpgrade(def.key));
                row.appendChild(btn);
                container.appendChild(row);
            });

            const baseContainer = document.getElementById('shop-base-upgrades');
            baseContainer.innerHTML = '';
            BASE_UPGRADE_DEFS.forEach(def => {
                const level = gameState.baseUpgrades[def.key];
                const cost = level < 3 ? def.costs[level] : null;
                const pips = '■'.repeat(level) + '□'.repeat(3 - level);
                const row = document.createElement('div');
                row.className = 'upgrade-row';
                row.innerHTML = `<span class="upgrade-name">${def.label}</span>` +
                    `<span class="upgrade-pips">${pips}</span>` +
                    `<span class="upgrade-cost">${cost ? cost + 'cr' : 'MAX'}</span>`;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.textContent = 'BUY';
                btn.disabled = !cost || gameState.credits < cost;
                btn.addEventListener('click', () => buyBaseUpgrade(def.key));
                row.appendChild(btn);
                baseContainer.appendChild(row);
            });
        }

        // --- Death ---
        document.getElementById('respawn-btn').addEventListener('click', respawn);

        function die() {
            gameState.dead = true;
            spawnParticles(gameState.ship.x, gameState.ship.y, 20, '#58a6ff', 300);
            const lost = gameState.ship.cargo.length;
            gameState.ship.cargo = [];
            let downgraded = '';
            const upgradeable = Object.keys(gameState.upgrades).filter(k => gameState.upgrades[k] > 0);
            if (upgradeable.length > 0) {
                const key = upgradeable[Math.floor(Math.random() * upgradeable.length)];
                gameState.upgrades[key]--;
                downgraded = UPGRADE_DEFS.find(d => d.key === key).label;
                applyUpgrades();
            }
            let msg = lost > 0 ? `Lost ${lost} cargo.` : 'No cargo lost.';
            if (downgraded) msg += ` ${downgraded} downgraded.`;
            document.getElementById('death-msg').textContent = msg;
            document.getElementById('death-overlay').classList.add('visible');
            saveGame();
        }

        function respawn() {
            const ship = gameState.ship;
            gameState.dead = false;
            ship.x = 0; ship.y = 0;
            ship.vx = 0; ship.vy = 0;
            ship.hull = ship.maxHull;
            ship.fuel = ship.maxFuel;
            ship.invulnTimer = 3;
            gameState.rocks = [];
            document.getElementById('death-overlay').classList.remove('visible');
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        // --- Rescue (out of fuel) ---
        document.getElementById('rescue-btn').addEventListener('click', startRescue);

        function triggerRescue() {
            gameState.stranded = true;
            const ship = gameState.ship;
            const cargoCount = ship.cargo.length;
            ship.cargo = [];
            const fee = gameState.credits < 5 ? gameState.credits : Math.max(5, Math.floor(gameState.credits * 0.25));
            gameState.credits -= fee;
            let msg = cargoCount > 0 ? `${cargoCount} cargo dumped for tow.` : 'No cargo to dump.';
            msg += fee > 0 ? ` Rescue fee: ${fee} CR.` : '';
            document.getElementById('rescue-msg').textContent = msg;
            document.getElementById('rescue-overlay').classList.add('visible');
            saveGame();
        }

        function startRescue() {
            document.getElementById('rescue-overlay').classList.remove('visible');
            gameState.stranded = false;
            gameState.rescued = true;
            const ship = gameState.ship;
            const angleToBase = Math.atan2(-ship.y, -ship.x);
            const approachAngle = angleToBase + Math.PI;
            gameState.rescueTug = {
                x: ship.x + Math.cos(approachAngle) * 400,
                y: ship.y + Math.sin(approachAngle) * 400,
                angle: angleToBase,
                attached: false
            };
            gameState.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function updateRescue(dt) {
            const ship = gameState.ship;
            const tug = gameState.rescueTug;
            if (!tug) return;

            if (!tug.attached) {
                const dx = ship.x - tug.x;
                const dy = ship.y - tug.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                tug.angle = Math.atan2(dy, dx);
                if (dist < 30) {
                    tug.attached = true;
                } else {
                    const speed = 300;
                    tug.x += Math.cos(tug.angle) * speed * dt;
                    tug.y += Math.sin(tug.angle) * speed * dt;
                }
            } else {
                const dx = -tug.x;
                const dy = -tug.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 50) {
                    completeRescue();
                    return;
                }
                const angle = Math.atan2(dy, dx);
                tug.angle = angle;
                const speed = 500;
                tug.x += Math.cos(angle) * speed * dt;
                tug.y += Math.sin(angle) * speed * dt;
                ship.x = tug.x - Math.cos(angle) * 40;
                ship.y = tug.y - Math.sin(angle) * 40;
                ship.angle = angle;
                ship.vx = 0; ship.vy = 0;
            }
            gameState.camera.x = ship.x;
            gameState.camera.y = ship.y;
        }

        function completeRescue() {
            const ship = gameState.ship;
            ship.x = 0; ship.y = 0;
            ship.vx = 0; ship.vy = 0;
            ship.fuel = ship.maxFuel;
            ship.hull = ship.maxHull;
            ship.invulnTimer = 3;
            gameState.rescued = false;
            gameState.rescueTug = null;
            gameState.rocks = [];
            gameState.camera.x = 0;
            gameState.camera.y = 0;
            saveGame();
        }

        // --- Rock generation ---
        function generateRockVertices(radius, typeName) {
            let count;
            if (typeName === 'gold') {
                count = 5 + Math.floor(Math.random() * 2);
            } else {
                count = 7 + Math.floor(Math.random() * 5);
            }
            const verts = [];
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                let dist;
                if (typeName === 'gold') {
                    dist = radius * (i % 2 === 0 ? 1.0 : 0.55);
                } else {
                    dist = radius * (0.7 + Math.random() * 0.3);
                }
                verts.push({ angle, dist });
            }
            return verts;
        }

        function spawnRock(x, y, tier, resourceTypeOverride) {
            const t = ROCK_TIERS[tier];
            const distFromOrigin = Math.sqrt(x * x + y * y);
            const driftScale = 1 + distFromOrigin / 3000;
            const angle = Math.random() * Math.PI * 2;
            const speed = ROCK_DRIFT_BASE * driftScale * (0.5 + Math.random());
            const resourceType = resourceTypeOverride || pickResource(distFromOrigin);
            gameState.rocks.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 2,
                tier, radius: t.radius, hp: t.hp,
                resourceType,
                vertices: generateRockVertices(t.radius, resourceType.name)
            });
        }

        function pickTier(dist) {
            const r = Math.random();
            if (dist > 3000) return r < 0.5 ? 'large' : r < 0.8 ? 'medium' : 'small';
            if (dist > 1500) return r < 0.3 ? 'large' : r < 0.7 ? 'medium' : 'small';
            if (dist > 500) return r < 0.1 ? 'large' : r < 0.4 ? 'medium' : 'small';
            return r < 0.2 ? 'medium' : 'small';
        }

        function getTargetRockCount() {
            const dist = Math.sqrt(gameState.ship.x ** 2 + gameState.ship.y ** 2);
            const densityBonus = gameState.upgrades.density * 3;
            return Math.min(ROCK_BASE_DENSITY + densityBonus + Math.floor(dist / 200), ROCK_MAX_COUNT + densityBonus);
        }

        // --- Particles ---
        function spawnParticles(x, y, count, color, speed) {
            for (let i = 0; i < count && gameState.particles.length < PARTICLE_MAX; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = speed * (0.3 + Math.random() * 0.7);
                gameState.particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: 0.4 + Math.random() * 0.4,
                    maxLife: 0.8,
                    color, size: 2 + Math.random() * 2
                });
            }
        }

        // --- Resource drops ---
        function pickResource(dist) {
            const scannerLevel = gameState.upgrades.scanner;
            const effectiveDist = dist + scannerLevel * 600;
            const available = RESOURCE_TYPES.filter(r => effectiveDist >= r.minDist);
            const bias = 1 + scannerLevel * 0.3;
            const weights = available.map((r, i) => Math.pow(bias, i));
            const total = weights.reduce((s, w) => s + w, 0);
            let roll = Math.random() * total;
            for (let i = 0; i < available.length; i++) {
                roll -= weights[i];
                if (roll <= 0) return available[i];
            }
            return available[available.length - 1];
        }

        function dropResources(rock) {
            const count = rock.tier === 'large' ? 3 : rock.tier === 'medium' ? 2 : 1;
            for (let i = 0; i < count; i++) {
                const type = rock.resourceType;
                const offset = 20;
                gameState.resources.push({
                    x: rock.x + (Math.random() - 0.5) * offset,
                    y: rock.y + (Math.random() - 0.5) * offset,
                    type: type.name, color: type.color, value: type.value,
                    life: RESOURCE_LIFETIME,
                    bobPhase: Math.random() * Math.PI * 2
                });
            }
        }

        // --- Auto-aim ---
        function findNearestRock(range) {
            const ship = gameState.ship;
            let nearest = null, minDist = range;
            for (const rock of gameState.rocks) {
                const dx = rock.x - ship.x, dy = rock.y - ship.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < minDist) { minDist = d; nearest = rock; }
            }
            return nearest;
        }

        // --- Update functions ---
        function updateShip(dt) {
            const ship = gameState.ship;
            const derived = gameState.derived;

            if (gameState.isMobile && gameState.joystick.active) {
                ship.angle = -gameState.joystick.angle;
                ship.thrust = gameState.joystick.force;
            } else if (!gameState.isMobile) {
                let mx = 0, my = 0;
                if (gameState.keys['ArrowLeft'] || gameState.keys['KeyA']) mx -= 1;
                if (gameState.keys['ArrowRight'] || gameState.keys['KeyD']) mx += 1;
                if (gameState.keys['ArrowUp'] || gameState.keys['KeyW']) my -= 1;
                if (gameState.keys['ArrowDown'] || gameState.keys['KeyS']) my += 1;
                if (mx !== 0 || my !== 0) {
                    ship.angle = Math.atan2(my, mx);
                    ship.thrust = 1;
                } else {
                    ship.thrust = 0;
                }
            } else {
                ship.thrust = 0;
            }

            if (ship.thrust > 0 && ship.fuel > 0) {
                const prevPct = ship.fuel / ship.maxFuel;
                ship.fuel -= FUEL_DRAIN_RATE * ship.thrust * dt;
                if (ship.fuel < 0) ship.fuel = 0;
                const newPct = ship.fuel / ship.maxFuel;
                if (prevPct > 0.5 && newPct <= 0.5) {
                    gameState.fuelWarnFlash = 2; gameState.fuelWarnMsg = 'HALF FUEL';
                } else if (prevPct > 0.2 && newPct <= 0.2) {
                    gameState.fuelWarnFlash = 2.5; gameState.fuelWarnMsg = 'LOW FUEL';
                }
                ship.vx += Math.cos(ship.angle) * derived.accel * ship.thrust * dt;
                ship.vy += Math.sin(ship.angle) * derived.accel * ship.thrust * dt;
                if (gameState.particles.length < PARTICLE_MAX && Math.random() < 0.6) {
                    const bx = ship.x - Math.cos(ship.angle) * ship.size * 0.5;
                    const by = ship.y - Math.sin(ship.angle) * ship.size * 0.5;
                    gameState.particles.push({
                        x: bx, y: by,
                        vx: -Math.cos(ship.angle) * 80 + (Math.random() - 0.5) * 40,
                        vy: -Math.sin(ship.angle) * 80 + (Math.random() - 0.5) * 40,
                        life: 0.2 + Math.random() * 0.15, maxLife: 0.35,
                        color: '#f0883e', size: 2
                    });
                }
            } else if (ship.fuel <= 0) {
                ship.thrust = 0;
                ship.invulnTimer = Infinity;
            }

            const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
            if (ship.fuel <= 0 && speed < 5 && !gameState.stranded && !gameState.dead && !gameState.docked) {
                triggerRescue();
                return;
            }
            if (speed > derived.maxSpeed) {
                ship.vx = (ship.vx / speed) * derived.maxSpeed;
                ship.vy = (ship.vy / speed) * derived.maxSpeed;
            }

            ship.vx *= SHIP_DRAG;
            ship.vy *= SHIP_DRAG;
            ship.x += ship.vx * dt;
            ship.y += ship.vy * dt;

            gameState.camera.x = ship.x;
            gameState.camera.y = ship.y;

            if (ship.invulnTimer > 0) ship.invulnTimer -= dt;
            if (gameState.cargoFullFlash > 0) gameState.cargoFullFlash -= dt;
            if (gameState.fuelWarnFlash > 0) gameState.fuelWarnFlash -= dt;
        }

        function updateShooting(dt) {
            const ship = gameState.ship;
            ship.fireTimer -= dt;

            let shouldFire = false;
            let fireAngle = ship.angle;

            if (gameState.isMobile) {
                const target = findNearestRock(AUTOAIM_RANGE);
                if (target && (gameState.joystick.active || fireButtonDown)) {
                    fireAngle = Math.atan2(target.y - ship.y, target.x - ship.x);
                    shouldFire = true;
                }
                if (fireButtonDown && !target) {
                    shouldFire = true;
                    fireAngle = ship.angle;
                }
            } else {
                if (gameState.mouse.down || gameState.keys['Space']) {
                    shouldFire = true;
                    if (gameState.mouse.down) {
                        fireAngle = Math.atan2(
                            gameState.mouse.y - canvas.height / 2,
                            gameState.mouse.x - canvas.width / 2
                        );
                    } else {
                        const target = findNearestRock(AUTOAIM_RANGE);
                        if (target) fireAngle = Math.atan2(target.y - ship.y, target.x - ship.x);
                    }
                }
            }

            if (shouldFire && ship.fireTimer <= 0) {
                ship.fireTimer = gameState.derived.fireRate;
                gameState.bullets.push({
                    x: ship.x + Math.cos(fireAngle) * ship.size,
                    y: ship.y + Math.sin(fireAngle) * ship.size,
                    vx: Math.cos(fireAngle) * BULLET_SPEED + ship.vx * 0.3,
                    vy: Math.sin(fireAngle) * BULLET_SPEED + ship.vy * 0.3,
                    life: BULLET_LIFETIME,
                    angle: fireAngle
                });
            }
        }

        function updateBullets(dt) {
            for (let i = gameState.bullets.length - 1; i >= 0; i--) {
                const b = gameState.bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;
                if (b.life <= 0) gameState.bullets.splice(i, 1);
            }
        }

        function updateRocks(dt) {
            const ship = gameState.ship;
            const defenseLevel = gameState.baseUpgrades.defense;

            for (let i = gameState.rocks.length - 1; i >= 0; i--) {
                const rock = gameState.rocks[i];
                rock.x += rock.vx * dt;
                rock.y += rock.vy * dt;
                rock.rotation += rock.rotSpeed * dt;

                const dx = rock.x - ship.x, dy = rock.y - ship.y;
                if (dx * dx + dy * dy > ROCK_DESPAWN_RADIUS * ROCK_DESPAWN_RADIUS) {
                    gameState.rocks.splice(i, 1);
                    continue;
                }

                if (defenseLevel > 0) {
                    const distToBase = Math.sqrt(rock.x * rock.x + rock.y * rock.y);
                    if (distToBase < BASE_SAFE_RADIUS * 0.8) {
                        spawnParticles(rock.x, rock.y, 6, rock.resourceType.color, 100);
                        dropResources(rock);
                        gameState.rocks.splice(i, 1);
                    }
                }
            }

            const target = getTargetRockCount();
            let attempts = 0;
            while (gameState.rocks.length < target && attempts < 5) {
                attempts++;
                const angle = Math.random() * Math.PI * 2;
                const dist = 800 + Math.random() * 400;
                const sx = ship.x + Math.cos(angle) * dist;
                const sy = ship.y + Math.sin(angle) * dist;
                const distToBase = Math.sqrt(sx * sx + sy * sy);
                if (distToBase < BASE_SAFE_RADIUS) continue;
                const distFromOrigin = Math.sqrt(sx * sx + sy * sy);
                spawnRock(sx, sy, pickTier(distFromOrigin));
            }
        }

        function updateParticles(dt) {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) gameState.particles.splice(i, 1);
            }
        }

        function updateResources(dt) {
            const ship = gameState.ship;
            const magnetRange = gameState.upgrades.magnet > 0 ? 50 + gameState.upgrades.magnet * 30 : 0;
            const baseMagnet = gameState.baseUpgrades.defense >= 2;
            for (let i = gameState.resources.length - 1; i >= 0; i--) {
                const r = gameState.resources[i];
                r.life -= dt;
                r.bobPhase += dt * 3;

                const dx = r.x - ship.x, dy = r.y - ship.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (r.life <= 0 || dx * dx + dy * dy > ROCK_DESPAWN_RADIUS * ROCK_DESPAWN_RADIUS) {
                    gameState.resources.splice(i, 1);
                    continue;
                }

                if (baseMagnet) {
                    const bdx = r.x, bdy = r.y;
                    const bDist = Math.sqrt(bdx * bdx + bdy * bdy);
                    if (bDist < BASE_SAFE_RADIUS && bDist > 20) {
                        r.x -= (bdx / bDist) * 60 * dt;
                        r.y -= (bdy / bDist) * 60 * dt;
                    }
                }

                if (magnetRange > 0 && dist < magnetRange && dist > RESOURCE_COLLECT_RADIUS) {
                    const pullSpeed = 100;
                    r.x -= (dx / dist) * pullSpeed * dt;
                    r.y -= (dy / dist) * pullSpeed * dt;
                }

                if (dist < RESOURCE_COLLECT_RADIUS) {
                    if (ship.cargo.length < ship.maxCargo) {
                        ship.cargo.push({ type: r.type, value: r.value });
                        spawnParticles(r.x, r.y, 4, r.color, 60);
                        gameState.resources.splice(i, 1);
                    } else {
                        gameState.cargoFullFlash = 1;
                    }
                }
            }
        }

        function checkCollisions() {
            const ship = gameState.ship;

            // Bullets vs rocks
            for (let bi = gameState.bullets.length - 1; bi >= 0; bi--) {
                const b = gameState.bullets[bi];
                for (let ri = gameState.rocks.length - 1; ri >= 0; ri--) {
                    const rock = gameState.rocks[ri];
                    const dx = b.x - rock.x, dy = b.y - rock.y;
                    if (dx * dx + dy * dy < rock.radius * rock.radius) {
                        gameState.bullets.splice(bi, 1);
                        rock.hp--;
                        spawnParticles(b.x, b.y, 3, rock.resourceType.color, 80);
                        if (rock.hp <= 0) {
                            const tier = ROCK_TIERS[rock.tier];
                            spawnParticles(rock.x, rock.y, 10, rock.resourceType.color, 150);
                            dropResources(rock);
                            if (tier.children > 0) {
                                for (let c = 0; c < tier.children; c++) {
                                    spawnRock(
                                        rock.x + (Math.random() - 0.5) * 20,
                                        rock.y + (Math.random() - 0.5) * 20,
                                        tier.childTier,
                                        rock.resourceType
                                    );
                                }
                            }
                            gameState.rocks.splice(ri, 1);
                        }
                        break;
                    }
                }
            }

            // Ship vs rocks
            if (ship.invulnTimer <= 0) {
                for (const rock of gameState.rocks) {
                    const dx = ship.x - rock.x, dy = ship.y - rock.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < rock.radius + ship.size * 0.6) {
                        ship.hull -= COLLISION_DAMAGE;
                        ship.invulnTimer = INVULN_TIME;
                        const angle = Math.atan2(dy, dx);
                        ship.vx += Math.cos(angle) * 200;
                        ship.vy += Math.sin(angle) * 200;
                        spawnParticles(ship.x, ship.y, 8, '#f85149', 120);
                        if (ship.hull <= 0) { die(); return; }
                        break;
                    }
                }
            }
        }

        function checkDocking() {
            const ship = gameState.ship;
            const base = gameState.base;
            const dx = ship.x - base.x, dy = ship.y - base.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const dockBtn = document.getElementById('dock-button');
            if (dist < base.radius * 1.5 && !gameState.docked && !gameState.shopOpen) {
                dockBtn.classList.add('visible');
            } else {
                dockBtn.classList.remove('visible');
            }
            if (dist > base.radius * 2.5) {
                gameState.docked = false;
            }
        }

        // --- Drawing ---
        function drawStars() {
            const cam = gameState.camera;
            for (const star of gameState.stars) {
                const parallax = star.layer;
                let sx = (star.x - cam.x * parallax) % STAR_FIELD_SIZE;
                let sy = (star.y - cam.y * parallax) % STAR_FIELD_SIZE;
                const hw = canvas.width / 2, hh = canvas.height / 2;
                if (sx < -hw) sx += STAR_FIELD_SIZE;
                if (sx > hw) sx -= STAR_FIELD_SIZE;
                if (sy < -hh) sy += STAR_FIELD_SIZE;
                if (sy > hh) sy -= STAR_FIELD_SIZE;
                const screenX = sx + hw, screenY = sy + hh;
                if (screenX >= 0 && screenX <= canvas.width && screenY >= 0 && screenY <= canvas.height) {
                    ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
                    ctx.fillRect(screenX, screenY, star.size, star.size);
                }
            }
        }

        function drawBase() {
            const base = gameState.base;
            const sx = base.x - gameState.camera.x + canvas.width / 2;
            const sy = base.y - gameState.camera.y + canvas.height / 2;
            if (sx < -150 || sx > canvas.width + 150 || sy < -150 || sy > canvas.height + 150) return;

            gameState.base.pulse += 0.02;
            const t = gameState.base.pulse;
            const pulse = 0.5 + Math.sin(t) * 0.3;
            const bu = gameState.baseUpgrades;

            ctx.beginPath();
            ctx.arc(sx, sy, base.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(63,185,80,${pulse * 0.3})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 - t * 0.15;
                ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * 35, sy + Math.sin(a) * 35);
            }
            ctx.closePath();
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 + t * 0.3;
                ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * 16, sy + Math.sin(a) * 16);
            }
            ctx.closePath();
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 + t * 0.3;
                ctx.moveTo(sx + Math.cos(a) * 16, sy + Math.sin(a) * 16);
                ctx.lineTo(sx + Math.cos(a) * 33, sy + Math.sin(a) * 33);
            }
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 + t * 0.5;
                ctx.moveTo(sx + Math.cos(a) * 35, sy + Math.sin(a) * 35);
                ctx.lineTo(sx + Math.cos(a) * 48, sy + Math.sin(a) * 48);
                const tipX = sx + Math.cos(a) * 48, tipY = sy + Math.sin(a) * 48;
                const pa = a + Math.PI / 2;
                ctx.moveTo(tipX + Math.cos(pa) * 4, tipY + Math.sin(pa) * 4);
                ctx.lineTo(tipX - Math.cos(pa) * 4, tipY - Math.sin(pa) * 4);
            }
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
                const bx = sx + Math.cos(a) * base.radius * 0.85;
                const by = sy + Math.sin(a) * base.radius * 0.85;
                const inA = a + Math.PI;
                ctx.moveTo(bx + Math.cos(inA + 0.3) * 6, by + Math.sin(inA + 0.3) * 6);
                ctx.lineTo(bx + Math.cos(inA) * 10, by + Math.sin(inA) * 10);
                ctx.lineTo(bx + Math.cos(inA - 0.3) * 6, by + Math.sin(inA - 0.3) * 6);
            }
            ctx.strokeStyle = `rgba(63,185,80,${pulse})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            if (bu.sellBonus > 0) {
                for (let i = 0; i < bu.sellBonus * 2; i++) {
                    const a = (i / (bu.sellBonus * 2)) * Math.PI * 2 + t * 0.1;
                    ctx.beginPath();
                    ctx.arc(sx + Math.cos(a) * 35, sy + Math.sin(a) * 35, 3, 0, Math.PI * 2);
                    ctx.strokeStyle = '#3fb950';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            if (bu.defense > 0) {
                for (let i = 0; i < bu.defense * 2; i++) {
                    const a = (i / (bu.defense * 2)) * Math.PI * 2 - t * 0.8;
                    const tx = sx + Math.cos(a) * base.radius * 0.95;
                    const ty = sy + Math.sin(a) * base.radius * 0.95;
                    ctx.beginPath();
                    ctx.arc(tx, ty, 2, 0, Math.PI * 2);
                    ctx.strokeStyle = '#f85149';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                if (bu.defense >= 2) {
                    ctx.beginPath();
                    ctx.arc(sx, sy, 26, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(88,166,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        function drawRockStripes(radius) {
            const stripeAngle = Math.PI / 6;
            const cos = Math.cos(stripeAngle), sin = Math.sin(stripeAngle);
            const spacing = radius * 0.45;
            ctx.beginPath();
            for (let offset = -1; offset <= 1; offset++) {
                const cx = -sin * offset * spacing;
                const cy = cos * offset * spacing;
                ctx.moveTo(cx + cos * radius * 0.8, cy + sin * radius * 0.8);
                ctx.lineTo(cx - cos * radius * 0.8, cy - sin * radius * 0.8);
            }
            ctx.stroke();
        }

        function drawRockDots(radius) {
            const positions = [[0.3,0.2],[-0.2,0.4],[0.1,-0.3],[-0.4,-0.1],[0.35,-0.25]];
            ctx.beginPath();
            for (const [px, py] of positions) {
                const x = px * radius, y = py * radius;
                ctx.moveTo(x + 2.5, y);
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            }
            ctx.stroke();
        }

        function drawRockVeins(vertices) {
            ctx.beginPath();
            const len = vertices.length;
            for (let i = 0; i < len; i += 2) {
                const v = vertices[i];
                const d = v.dist * 0.5;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(v.angle) * d, Math.sin(v.angle) * d);
            }
            for (let i = 0; i < len; i += 2) {
                const v1 = vertices[i], v2 = vertices[(i + 2) % len];
                ctx.moveTo(Math.cos(v1.angle) * v1.dist * 0.5, Math.sin(v1.angle) * v1.dist * 0.5);
                ctx.lineTo(Math.cos(v2.angle) * v2.dist * 0.5, Math.sin(v2.angle) * v2.dist * 0.5);
            }
            ctx.stroke();
        }

        function drawRocks() {
            const cam = gameState.camera;
            for (const rock of gameState.rocks) {
                const sx = rock.x - cam.x + canvas.width / 2;
                const sy = rock.y - cam.y + canvas.height / 2;
                if (sx < -60 || sx > canvas.width + 60 || sy < -60 || sy > canvas.height + 60) continue;

                const resColor = rock.resourceType.color;
                const resName = rock.resourceType.name;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(rock.rotation);

                ctx.beginPath();
                for (let i = 0; i < rock.vertices.length; i++) {
                    const v = rock.vertices[i];
                    const method = i === 0 ? 'moveTo' : 'lineTo';
                    ctx[method](Math.cos(v.angle) * v.dist, Math.sin(v.angle) * v.dist);
                }
                ctx.closePath();
                ctx.strokeStyle = resColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.strokeStyle = resColor;
                ctx.lineWidth = 0.8;
                ctx.globalAlpha = 0.5;
                if (resName === 'copper') drawRockStripes(rock.radius);
                else if (resName === 'platinum') drawRockDots(rock.radius);
                else if (resName === 'crystal') drawRockVeins(rock.vertices);
                ctx.globalAlpha = 1;

                ctx.restore();
            }
        }

        function drawBullets() {
            ctx.strokeStyle = '#f85149';
            ctx.lineWidth = 2;
            for (const b of gameState.bullets) {
                const sx = b.x - gameState.camera.x + canvas.width / 2;
                const sy = b.y - gameState.camera.y + canvas.height / 2;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - Math.cos(b.angle) * BULLET_LENGTH, sy - Math.sin(b.angle) * BULLET_LENGTH);
                ctx.stroke();
            }
        }

        function drawResources() {
            const cam = gameState.camera;
            for (const r of gameState.resources) {
                const sx = r.x - cam.x + canvas.width / 2;
                const sy = r.y - cam.y + canvas.height / 2 + Math.sin(r.bobPhase) * 3;
                if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) continue;

                const alpha = r.life < 5 ? r.life / 5 : 1;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(r.bobPhase * 0.5);
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    const method = i === 0 ? 'moveTo' : 'lineTo';
                    ctx[method](Math.cos(a) * 6, Math.sin(a) * 6);
                }
                ctx.closePath();
                ctx.strokeStyle = r.color.replace(')', `,${alpha})`).replace('rgb', 'rgba').replace('#', '');
                ctx.strokeStyle = r.color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }

        function drawParticles() {
            for (const p of gameState.particles) {
                const sx = p.x - gameState.camera.x + canvas.width / 2;
                const sy = p.y - gameState.camera.y + canvas.height / 2;
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(sx - p.size / 2, sy - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawTug() {
            const tug = gameState.rescueTug;
            if (!tug) return;
            const ship = gameState.ship;
            const cam = gameState.camera;
            const sx = (tug.x - cam.x) + canvas.width / 2;
            const sy = (tug.y - cam.y) + canvas.height / 2;
            const size = SHIP_SIZE * 0.6;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(tug.angle);
            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(-size * 0.7, -size * 0.6);
            ctx.lineTo(-size * 0.4, 0);
            ctx.lineTo(-size * 0.7, size * 0.6);
            ctx.closePath();
            ctx.strokeStyle = '#e3b341';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            if (tug.attached) {
                const shipSx = canvas.width / 2;
                const shipSy = canvas.height / 2;
                ctx.beginPath();
                ctx.setLineDash([6, 4]);
                ctx.moveTo(sx, sy);
                ctx.lineTo(shipSx, shipSy);
                ctx.strokeStyle = '#e3b341';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawShipHull(s) {
            const level = gameState.upgrades.hull;
            ctx.beginPath();
            switch (level) {
                case 0:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(-s * 0.7, -s * 0.6);
                    ctx.lineTo(-s * 0.4, 0);
                    ctx.lineTo(-s * 0.7, s * 0.6);
                    break;
                case 1:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(-s * 0.5, -s * 0.7);
                    ctx.lineTo(-s * 0.7, -s * 0.7);
                    ctx.lineTo(-s * 0.6, -s * 0.4);
                    ctx.lineTo(-s * 0.4, 0);
                    ctx.lineTo(-s * 0.6, s * 0.4);
                    ctx.lineTo(-s * 0.7, s * 0.7);
                    ctx.lineTo(-s * 0.5, s * 0.7);
                    break;
                case 2:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(s * 0.3, -s * 0.4);
                    ctx.lineTo(-s * 0.5, -s * 0.8);
                    ctx.lineTo(-s * 0.8, -s * 0.6);
                    ctx.lineTo(-s * 0.5, 0);
                    ctx.lineTo(-s * 0.8, s * 0.6);
                    ctx.lineTo(-s * 0.5, s * 0.8);
                    ctx.lineTo(s * 0.3, s * 0.4);
                    break;
                case 3:
                    ctx.moveTo(s * 1.1, 0);
                    ctx.lineTo(s * 0.5, -s * 0.3);
                    ctx.lineTo(s * 0.3, -s * 0.3);
                    ctx.lineTo(-s * 0.4, -s * 0.9);
                    ctx.lineTo(-s * 0.9, -s * 0.5);
                    ctx.lineTo(-s * 0.5, 0);
                    ctx.lineTo(-s * 0.9, s * 0.5);
                    ctx.lineTo(-s * 0.4, s * 0.9);
                    ctx.lineTo(s * 0.3, s * 0.3);
                    ctx.lineTo(s * 0.5, s * 0.3);
                    break;
                case 4:
                    ctx.moveTo(s * 1.2, 0);
                    ctx.lineTo(s * 0.4, -s * 0.35);
                    ctx.lineTo(-s * 0.2, -s * 0.5);
                    ctx.lineTo(-s * 0.6, -s * 0.9);
                    ctx.lineTo(-s * 1.0, -s * 0.6);
                    ctx.lineTo(-s * 0.8, -s * 0.3);
                    ctx.lineTo(-s * 0.6, 0);
                    ctx.lineTo(-s * 0.8, s * 0.3);
                    ctx.lineTo(-s * 1.0, s * 0.6);
                    ctx.lineTo(-s * 0.6, s * 0.9);
                    ctx.lineTo(-s * 0.2, s * 0.5);
                    ctx.lineTo(s * 0.4, s * 0.35);
                    break;
                default:
                    ctx.moveTo(s * 1.3, 0);
                    ctx.lineTo(s * 0.7, -s * 0.2);
                    ctx.lineTo(s * 0.5, -s * 0.45);
                    ctx.lineTo(-s * 0.1, -s * 0.55);
                    ctx.lineTo(-s * 0.5, -s * 1.0);
                    ctx.lineTo(-s * 1.0, -s * 0.7);
                    ctx.lineTo(-s * 0.8, -s * 0.35);
                    ctx.lineTo(-s * 0.7, 0);
                    ctx.lineTo(-s * 0.8, s * 0.35);
                    ctx.lineTo(-s * 1.0, s * 0.7);
                    ctx.lineTo(-s * 0.5, s * 1.0);
                    ctx.lineTo(-s * 0.1, s * 0.55);
                    ctx.lineTo(s * 0.5, s * 0.45);
                    ctx.lineTo(s * 0.7, s * 0.2);
                    break;
            }
            ctx.closePath();
            ctx.strokeStyle = '#58a6ff';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (level >= 3) {
                ctx.beginPath();
                ctx.moveTo(s * 0.4, -s * 0.15);
                ctx.lineTo(-s * 0.2, -s * 0.3);
                ctx.moveTo(s * 0.4, s * 0.15);
                ctx.lineTo(-s * 0.2, s * 0.3);
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.4;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function drawUpgradeAddons(s) {
            const u = gameState.upgrades;

            if (u.fuel > 0) {
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1;
                const count = Math.ceil(u.fuel / 2);
                for (let i = 0; i < count; i++) {
                    const xOff = -s * 0.2 - i * s * 0.15;
                    ctx.strokeRect(xOff - 2, -s * 0.7 - 3, 4, 5);
                    ctx.strokeRect(xOff - 2, s * 0.7 - 2, 4, 5);
                }
            }

            if (u.cargo > 0) {
                ctx.strokeStyle = '#8b949e';
                ctx.lineWidth = 1;
                const ext = u.cargo * 0.06;
                ctx.beginPath();
                ctx.moveTo(-s * 0.5, -s * (0.5 + ext));
                ctx.lineTo(-s * 0.7, -s * (0.5 + ext));
                ctx.moveTo(-s * 0.5, s * (0.5 + ext));
                ctx.lineTo(-s * 0.7, s * (0.5 + ext));
                ctx.stroke();
            }

            if (u.speed > 0) {
                ctx.strokeStyle = '#d2a8ff';
                ctx.lineWidth = 0.7;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                for (let i = 0; i < Math.min(u.speed, 3); i++) {
                    const yOff = (i - 1) * s * 0.12;
                    ctx.moveTo(s * 0.6, yOff);
                    ctx.lineTo(-s * 0.3, yOff);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            if (u.fireRate > 0) {
                ctx.strokeStyle = '#f85149';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (u.fireRate >= 1) { ctx.moveTo(s * 0.8, -s * 0.15); ctx.lineTo(s * 1.1, -s * 0.15); }
                if (u.fireRate >= 2) { ctx.moveTo(s * 0.8, s * 0.15); ctx.lineTo(s * 1.1, s * 0.15); }
                if (u.fireRate >= 4) { ctx.moveTo(s * 0.9, -s * 0.3); ctx.lineTo(s * 1.15, -s * 0.3); }
                ctx.stroke();
            }

            if (u.thrust > 0) {
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1;
                ctx.beginPath();
                const nw = s * 0.12 + u.thrust * s * 0.03;
                ctx.moveTo(-s * 0.45, -nw); ctx.lineTo(-s * 0.55, -nw * 1.3);
                ctx.moveTo(-s * 0.45, nw); ctx.lineTo(-s * 0.55, nw * 1.3);
                if (u.thrust >= 3) {
                    ctx.moveTo(-s * 0.6, -s * 0.35); ctx.lineTo(-s * 0.7, -s * 0.4);
                    ctx.moveTo(-s * 0.6, s * 0.35); ctx.lineTo(-s * 0.7, s * 0.4);
                }
                ctx.stroke();
            }

            if (u.scanner > 0) {
                ctx.strokeStyle = '#3fb950';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(s * 0.1, -s * 0.4);
                ctx.lineTo(s * 0.1, -s * 0.7);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(s * 0.1, -s * 0.7, 3 + u.scanner, -Math.PI * 0.7, -Math.PI * 0.3);
                ctx.stroke();
            }

            if (u.density > 0) {
                ctx.strokeStyle = '#e3b341';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                const dl = s * 0.2 + u.density * s * 0.05;
                ctx.moveTo(s, 0); ctx.lineTo(s + dl, 0);
                if (u.density >= 2) {
                    ctx.moveTo(s + 2, -3); ctx.lineTo(s + dl * 0.5, 0); ctx.lineTo(s + 2, 3);
                }
                ctx.stroke();
            }

            if (u.magnet > 0) {
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(0, s * 0.5, s * 0.4 + u.magnet * 2, Math.PI * 0.2, Math.PI * 0.8);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function drawShip() {
            const ship = gameState.ship;
            if (ship.invulnTimer > 0 && ship.invulnTimer !== Infinity && Math.floor(ship.invulnTimer * 10) % 2 === 0) return;

            const screenX = canvas.width / 2;
            const screenY = canvas.height / 2;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(ship.angle);

            drawShipHull(ship.size);
            drawUpgradeAddons(ship.size);

            if (ship.thrust > 0 && ship.fuel > 0) {
                const flameSize = ship.size * 0.5 * (0.7 + Math.random() * 0.3);
                ctx.beginPath();
                ctx.moveTo(-ship.size * 0.4, -ship.size * 0.2);
                ctx.lineTo(-ship.size * 0.4 - flameSize, 0);
                ctx.lineTo(-ship.size * 0.4, ship.size * 0.2);
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawHUD() {
            const ship = gameState.ship;
            const dist = Math.sqrt(ship.x * ship.x + ship.y * ship.y);
            const vel = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);

            ctx.font = '13px Courier New';
            ctx.textAlign = 'left';
            let y = 24;

            ctx.fillStyle = '#484f58';
            ctx.textAlign = 'right';
            ctx.fillText('v1.0', canvas.width - 14, 24);
            ctx.textAlign = 'left';

            ctx.fillStyle = '#8b949e';
            ctx.fillText(`DIST: ${Math.floor(dist)}`, 14, y); y += 18;
            ctx.fillText(`VEL: ${Math.floor(vel)}`, 14, y); y += 18;

            const fuelPct = ship.fuel / ship.maxFuel;
            ctx.fillStyle = fuelPct < 0.2 ? '#f85149' : '#8b949e';
            const fuelBars = Math.ceil(fuelPct * 10);
            ctx.fillText(`FUEL: ${'|'.repeat(fuelBars)}${'-'.repeat(10 - fuelBars)} ${Math.floor(ship.fuel)}`, 14, y); y += 18;

            const hullPct = ship.hull / ship.maxHull;
            ctx.fillStyle = hullPct <= 0.34 ? '#f85149' : '#8b949e';
            ctx.fillText(`HULL: ${'█'.repeat(ship.hull)}${'░'.repeat(ship.maxHull - ship.hull)}`, 14, y); y += 18;

            ctx.fillStyle = '#8b949e';
            ctx.fillText(`CARGO: ${ship.cargo.length}/${ship.maxCargo}`, 14, y); y += 18;
            ctx.fillText(`CR: ${gameState.credits}`, 14, y);

            if (gameState.cargoFullFlash > 0) {
                ctx.fillStyle = '#f85149';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('CARGO FULL', canvas.width / 2, canvas.height - 40);
            }

            if (gameState.fuelWarnFlash > 0) {
                const alpha = Math.min(1, gameState.fuelWarnFlash);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = gameState.fuelWarnMsg === 'LOW FUEL' ? '#f85149' : '#f0883e';
                ctx.font = '18px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(gameState.fuelWarnMsg, canvas.width / 2, canvas.height / 2 - 60);
                ctx.globalAlpha = 1;
            }

            // Home indicator
            if (dist > 100) {
                const homeAngle = Math.atan2(-ship.y, -ship.x);
                const indicatorDist = 60;
                const ix = canvas.width / 2 + Math.cos(homeAngle) * indicatorDist;
                const iy = canvas.height / 2 + Math.sin(homeAngle) * indicatorDist;
                ctx.beginPath();
                ctx.arc(ix, iy, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#3fb950';
                ctx.fill();
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('HOME', ix, iy + 14);
            }
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (gameState.paused || gameState.shopOpen || gameState.dead || gameState.stranded) return;

            const dt = Math.min((timestamp - gameState.lastTime) / 1000, 0.05);
            gameState.lastTime = timestamp;

            if (gameState.rescued) {
                updateRescue(dt);
                updateParticles(dt);
            } else {
                updateShip(dt);
                updateShooting(dt);
                updateBullets(dt);
                updateRocks(dt);
                updateParticles(dt);
                updateResources(dt);
                checkCollisions();
                if (!gameState.dead) checkDocking();
            }

            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();
            drawBase();
            if (!gameState.rescued) {
                drawResources();
                drawRocks();
                drawBullets();
            }
            drawParticles();
            if (gameState.rescued) drawTug();
            drawShip();
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        // --- Fullscreen ---
        function requestFullscreen() {
            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (rfs && !document.fullscreenElement && !document.webkitFullscreenElement) {
                rfs.call(el).catch(() => {});
            }
        }
        document.addEventListener('touchstart', function goFull() {
            requestFullscreen();
            document.removeEventListener('touchstart', goFull);
        }, { once: true });

        // --- Start ---
        try { detectMobile(); } catch(e) { console.warn('Mobile init failed:', e); }
        loadGame();
        applyUpgrades();
        gameState.ship.hull = gameState.ship.maxHull;
        gameState.ship.fuel = gameState.ship.maxFuel;

        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawStars();
        drawBase();
        drawShip();
        drawHUD();

        gameState.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    })();
    </script>
</body>
</html>
