                        advanceQuest('collect', r.type);
                        gameState.resources.splice(i, 1);
                    } else if (ship.cargo.length < ship.maxCargo) {
                        ship.cargo.push({ type: r.type, value: r.value });
                        spawnParticles(r.x, r.y, 4, r.color, 60);
                        advanceQuest('collect', r.type);
                        gameState.resources.splice(i, 1);
                    } else {
                        gameState.cargoFullFlash = 1;
                    }
                }
            }
        }

        function checkCollisions() {
            const ship = gameState.ship;

            // Bullets vs rocks
            for (let bi = gameState.bullets.length - 1; bi >= 0; bi--) {
                const b = gameState.bullets[bi];
                for (let ri = gameState.rocks.length - 1; ri >= 0; ri--) {
                    const rock = gameState.rocks[ri];
                    const dx = b.x - rock.x, dy = b.y - rock.y;
                    if (dx * dx + dy * dy < rock.radius * rock.radius) {
                        b.pierced = (b.pierced || 0) + 1;
                        if (b.pierced > gameState.derived.pierceCount) gameState.bullets.splice(bi, 1);
                        rock.hp--;
                        spawnParticles(b.x, b.y, 3, rock.resourceType.color, 80);
                        if (rock.hp <= 0) {
                            const tier = ROCK_TIERS[rock.tier];
                            spawnParticles(rock.x, rock.y, 10, rock.resourceType.color, 150);
                            dropResources(rock);
                            advanceQuest('mine');
                            if (tier.children > 0) {
                                for (let c = 0; c < tier.children; c++) {
                                    spawnRock(
                                        rock.x + (Math.random() - 0.5) * 20,
                                        rock.y + (Math.random() - 0.5) * 20,
                                        tier.childTier,
                                        rock.resourceType
                                    );
                                }
                            }
                            gameState.rocks.splice(ri, 1);
                        }
                        break;
                    }
                }
            }

            // Ship vs rocks
            if (ship.invulnTimer <= 0) {
                for (const rock of gameState.rocks) {
                    const dx = ship.x - rock.x, dy = ship.y - rock.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < rock.radius + ship.size * 0.6) {
                        ship.hull -= COLLISION_DAMAGE;
                        ship.invulnTimer = gameState.derived.invulnTime;
                        const angle = Math.atan2(dy, dx);
                        ship.vx += Math.cos(angle) * 200;
                        ship.vy += Math.sin(angle) * 200;
                        spawnParticles(ship.x, ship.y, 8, '#f85149', 120);
                        if (ship.hull <= 0) { die(); return; }
                        break;
                    }
                }
            }
        }

        function checkDocking() {
            const ship = gameState.ship;
            const base = gameState.base;
            const dx = ship.x - base.x, dy = ship.y - base.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const dockBtn = document.getElementById('dock-button');
            if (dist < base.radius * 1.5 && !gameState.docked && !gameState.shopOpen) {
                dockBtn.classList.add('visible');
            } else {
                dockBtn.classList.remove('visible');
            }
            if (dist > base.radius * 2.5) {
                gameState.docked = false;
            }
        }

        // --- Enemies ---
        function spawnEnemy(type, x, y, attachedTo) {
            const defs = { turret: { hp: 3, radius: 14, cooldown: 2 }, drone: { hp: 2, radius: 10, cooldown: 0.5 }, gunship: { hp: 6, radius: 18, cooldown: 3 }, sentinel: { hp: 10, radius: 24, cooldown: 4 } };
            const def = defs[type];
            const distFromOrigin = Math.sqrt(x * x + y * y);
            const diffMult = 1 + (distFromOrigin / 5000) * 0.5;
            gameState.enemies.push({
                x, y, vx: 0, vy: 0,
                angle: Math.random() * Math.PI * 2,
                type, hp: Math.ceil(def.hp * diffMult), maxHp: Math.ceil(def.hp * diffMult),
                radius: def.radius,
                fireTimer: def.cooldown,
                fireCooldown: def.cooldown / Math.sqrt(diffMult),
                attachedTo: attachedTo || null,
                behavior: type === 'drone' ? { state: 'idle', timer: 1 + Math.random(), burstCount: 0 } :
                          type === 'gunship' ? { orbitAngle: Math.random() * Math.PI * 2, orbitDist: 350 + Math.random() * 150 } :
                          type === 'sentinel' ? { blinkTimer: 3 + Math.random() * 2, blinking: false } : {}
            });
        }

        function updateEnemies(dt) {
            const ship = gameState.ship;
            const shipDist = Math.sqrt(ship.x * ship.x + ship.y * ship.y);

            for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                const e = gameState.enemies[i];
                const dx = e.x - ship.x, dy = e.y - ship.y;
                const distToShip = Math.sqrt(dx * dx + dy * dy);

                if (distToShip > ROCK_DESPAWN_RADIUS) {
                    gameState.enemies.splice(i, 1);
                    continue;
                }

                if (gameState.baseUpgrades.defense > 0) {
                    const distToBase = Math.sqrt(e.x * e.x + e.y * e.y);
                    if (distToBase < getSafeRadius() * 0.8) {
                        spawnParticles(e.x, e.y, 8, '#f85149', 120);
                        gameState.enemies.splice(i, 1);
                        recordKill(e.type);
                        continue;
                    }
                }

                if (e.type === 'turret') {
                    if (e.attachedTo) {
                        if (!gameState.rocks.includes(e.attachedTo)) {
                            gameState.enemies.splice(i, 1);
                            spawnParticles(e.x, e.y, 6, '#f85149', 100);
                            recordKill(e.type);
                            continue;
                        }
                        e.x = e.attachedTo.x;
                        e.y = e.attachedTo.y;
                    }
                    e.angle = Math.atan2(ship.y - e.y, ship.x - e.x);
                    e.fireTimer -= dt;
                    if (e.fireTimer <= 0 && distToShip < 400) {
                        e.fireTimer = e.fireCooldown;
                        fireEnemyBullet(e);
                    }
                } else if (e.type === 'drone') {
                    const b = e.behavior;
                    b.timer -= dt;
                    e.angle = Math.atan2(ship.y - e.y, ship.x - e.x);
                    if (b.state === 'idle') {
                        e.vx *= 0.95; e.vy *= 0.95;
                        if (b.timer <= 0) {
                            b.state = 'dash';
                            b.timer = 0.5;
                            b.burstCount = 0;
                        }
                    } else if (b.state === 'dash') {
                        const dashSpeed = 350;
                        e.vx = Math.cos(e.angle) * dashSpeed;
                        e.vy = Math.sin(e.angle) * dashSpeed;
                        e.fireTimer -= dt;
                        if (e.fireTimer <= 0 && b.burstCount < 3) {
                            e.fireTimer = 0.15;
                            b.burstCount++;
                            fireEnemyBullet(e);
                        }
                        if (b.timer <= 0) {
                            b.state = 'idle';
                            b.timer = 1.5 + Math.random();
                        }
                    }
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                } else if (e.type === 'gunship') {
                    const b = e.behavior;
                    b.orbitAngle += dt * 0.5;
                    const targetX = ship.x + Math.cos(b.orbitAngle) * b.orbitDist;
                    const targetY = ship.y + Math.sin(b.orbitAngle) * b.orbitDist;
                    e.vx += (targetX - e.x) * 0.8 * dt;
                    e.vy += (targetY - e.y) * 0.8 * dt;
                    e.vx *= 0.98; e.vy *= 0.98;
                    e.x += e.vx * dt;
                    e.y += e.vy * dt;
                    e.angle = Math.atan2(ship.y - e.y, ship.x - e.x);
                    e.fireTimer -= dt;
                    if (e.fireTimer <= 0 && distToShip < 600) {
                        e.fireTimer = e.fireCooldown;
                        for (let s = -1; s <= 1; s++) {
                            const spread = s * 0.2;
                            gameState.enemyBullets.push({
                                x: e.x + Math.cos(e.angle) * e.radius,
                                y: e.y + Math.sin(e.angle) * e.radius,
                                vx: Math.cos(e.angle + spread) * ENEMY_BULLET_SPEED,
                                vy: Math.sin(e.angle + spread) * ENEMY_BULLET_SPEED,
                                life: ENEMY_BULLET_LIFETIME
                            });
                        }
                    }
                } else if (e.type === 'sentinel') {
                    const b = e.behavior;
                    e.angle = Math.atan2(ship.y - e.y, ship.x - e.x);
                    // Blink/teleport behavior
                    b.blinkTimer -= dt;
                    if (b.blinkTimer <= 0 && !b.blinking) {
                        b.blinking = true;
                        const teleAngle = Math.random() * Math.PI * 2;
                        const teleDist = 200 + Math.random() * 200;
                        e.x = ship.x + Math.cos(teleAngle) * teleDist;
                        e.y = ship.y + Math.sin(teleAngle) * teleDist;
                        spawnParticles(e.x, e.y, 6, '#e0e0e0', 80);
                        b.blinkTimer = 2.5 + Math.random() * 2;
                        b.blinking = false;
                    }
                    // Homing missile
                    e.fireTimer -= dt;
                    if (e.fireTimer <= 0 && distToShip < 700) {
                        e.fireTimer = e.fireCooldown;
                        const bAngle = e.angle;
                        gameState.enemyBullets.push({
                            x: e.x + Math.cos(bAngle) * e.radius,
                            y: e.y + Math.sin(bAngle) * e.radius,
                            vx: Math.cos(bAngle) * ENEMY_BULLET_SPEED * 0.6,
                            vy: Math.sin(bAngle) * ENEMY_BULLET_SPEED * 0.6,
                            life: ENEMY_BULLET_LIFETIME * 2,
                            homing: true
                        });
                    }
                }
            }

            // Spawn drones/gunships
            const droneCount = gameState.enemies.filter(e => e.type === 'drone').length;
            const gunshipCount = gameState.enemies.filter(e => e.type === 'gunship').length;
            const maxDrones = shipDist >= 4000 ? 4 : 2;
            const maxGunships = shipDist >= 6000 ? 2 : 1;

            if (shipDist >= 2500 && droneCount < maxDrones && Math.random() < 0.003) {
                const angle = Math.random() * Math.PI * 2;
                const d = 600 + Math.random() * 400;
                spawnEnemy('drone', ship.x + Math.cos(angle) * d, ship.y + Math.sin(angle) * d);
            }
            if (shipDist >= 4000 && gunshipCount < maxGunships && Math.random() < 0.001) {
                const angle = Math.random() * Math.PI * 2;
                const d = 700 + Math.random() * 300;
                spawnEnemy('gunship', ship.x + Math.cos(angle) * d, ship.y + Math.sin(angle) * d);
            }
            // Sentinel spawning
            const sentinelCount = gameState.enemies.filter(e => e.type === 'sentinel').length;
            const maxSentinels = shipDist >= 12000 ? 2 : 1;
            if (shipDist >= 8000 && sentinelCount < maxSentinels && Math.random() < 0.0005) {
                const angle = Math.random() * Math.PI * 2;
                const d = 500 + Math.random() * 300;
                spawnEnemy('sentinel', ship.x + Math.cos(angle) * d, ship.y + Math.sin(angle) * d);
            }
            // Enemy waves past 4000
            if (!gameState.waveTimer) gameState.waveTimer = 60 + Math.random() * 30;
            if (shipDist >= 4000) {
                gameState.waveTimer -= dt;
                if (gameState.waveTimer <= 0) {
                    gameState.waveTimer = 60 + Math.random() * 30;
                    const waveSize = 3 + Math.floor(shipDist / 4000);
                    const waveAngle = Math.random() * Math.PI * 2;
                    for (let w = 0; w < Math.min(waveSize, 6); w++) {
                        const spread = (w - waveSize / 2) * 0.3;
                        const d = 700 + Math.random() * 200;
                        spawnEnemy('drone', ship.x + Math.cos(waveAngle + spread) * d, ship.y + Math.sin(waveAngle + spread) * d);
                    }
                    gameState.fuelWarnFlash = 1.5;
                    gameState.fuelWarnMsg = 'WAVE INCOMING';
                }
            }
        }

        function fireEnemyBullet(enemy) {
            gameState.enemyBullets.push({
                x: enemy.x + Math.cos(enemy.angle) * enemy.radius,
                y: enemy.y + Math.sin(enemy.angle) * enemy.radius,
                vx: Math.cos(enemy.angle) * ENEMY_BULLET_SPEED,
                vy: Math.sin(enemy.angle) * ENEMY_BULLET_SPEED,
                life: ENEMY_BULLET_LIFETIME
            });
        }

        function updateEnemyBullets(dt) {
            const ship = gameState.ship;
            for (let i = gameState.enemyBullets.length - 1; i >= 0; i--) {
                const b = gameState.enemyBullets[i];
                if (b.homing) {
                    const hdx = ship.x - b.x, hdy = ship.y - b.y;
                    const targetAngle = Math.atan2(hdy, hdx);
                    const currentAngle = Math.atan2(b.vy, b.vx);
                    let diff = targetAngle - currentAngle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    const turnRate = 1.5 * dt;
                    const newAngle = currentAngle + Math.max(-turnRate, Math.min(turnRate, diff));
                    const spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                    b.vx = Math.cos(newAngle) * spd;
                    b.vy = Math.sin(newAngle) * spd;
                }
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;
                if (b.life <= 0) { gameState.enemyBullets.splice(i, 1); continue; }

                if (ship.invulnTimer <= 0 && ship.invulnTimer !== Infinity) {
                    const dx = b.x - ship.x, dy = b.y - ship.y;
                    if (dx * dx + dy * dy < (ship.size * 0.6) * (ship.size * 0.6)) {
                        ship.hull -= COLLISION_DAMAGE;
                        ship.invulnTimer = gameState.derived.invulnTime;
                        const angle = Math.atan2(dy, dx);
                        ship.vx -= Math.cos(angle) * 100;
                        ship.vy -= Math.sin(angle) * 100;
                        spawnParticles(ship.x, ship.y, 5, '#f85149', 80);
                        gameState.enemyBullets.splice(i, 1);
                        if (ship.hull <= 0) { die(); return; }
                    }
                }
            }
        }

        function checkEnemyCollisions() {
            const ship = gameState.ship;

            // Player bullets vs enemies
            for (let bi = gameState.bullets.length - 1; bi >= 0; bi--) {
                const b = gameState.bullets[bi];
                for (let ei = gameState.enemies.length - 1; ei >= 0; ei--) {
                    const enemy = gameState.enemies[ei];
                    const dx = b.x - enemy.x, dy = b.y - enemy.y;
                    if (dx * dx + dy * dy < enemy.radius * enemy.radius) {
                        gameState.bullets.splice(bi, 1);
                        enemy.hp--;
                        spawnParticles(b.x, b.y, 3, '#f85149', 80);
                        if (enemy.hp <= 0) {
                            spawnParticles(enemy.x, enemy.y, 12, '#f85149', 150);
                            const baseDrops = enemy.type === 'sentinel' ? (4 + Math.floor(Math.random() * 2)) : enemy.type === 'gunship' ? 3 : enemy.type === 'drone' ? (Math.random() < 0.5 ? 2 : 1) : 1;
                            const dropCount = baseDrops + gameState.derived.salvageBonus;
                            const scrapType = RESOURCE_TYPES.find(r => r.name === 'scrap');
                            for (let d = 0; d < dropCount; d++) {
                                gameState.resources.push({
                                    x: enemy.x + (Math.random() - 0.5) * 20,
                                    y: enemy.y + (Math.random() - 0.5) * 20,
                                    type: scrapType.name, color: scrapType.color, value: scrapType.value,
                                    life: RESOURCE_LIFETIME,
                                    bobPhase: Math.random() * Math.PI * 2
                                });
                            }
                            gameState.enemies.splice(ei, 1);
                            recordKill(enemy.type);
                        }
                        break;
                    }
                }
            }

            // Ship vs enemies (ram)
            if (ship.invulnTimer <= 0) {
                for (let ei = gameState.enemies.length - 1; ei >= 0; ei--) {
                    const enemy = gameState.enemies[ei];
                    const dx = ship.x - enemy.x, dy = ship.y - enemy.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < enemy.radius + ship.size * 0.6) {
                        ship.hull -= COLLISION_DAMAGE;
                        ship.invulnTimer = gameState.derived.invulnTime;
                        const angle = Math.atan2(dy, dx);
                        ship.vx += Math.cos(angle) * 200;
                        ship.vy += Math.sin(angle) * 200;
                        spawnParticles(ship.x, ship.y, 6, '#f85149', 100);
                        enemy.hp -= 2;
                        if (enemy.hp <= 0) {
                            spawnParticles(enemy.x, enemy.y, 8, '#f85149', 120);
                            gameState.enemies.splice(ei, 1);
                            recordKill(enemy.type);
                        }
                        if (ship.hull <= 0) { die(); return; }
                        break;
                    }
                }
            }
        }

        // --- Drawing ---
        function drawStars() {
            const cam = gameState.camera;
            for (const star of gameState.stars) {
                const parallax = star.layer;
                let sx = (star.x - cam.x * parallax) % STAR_FIELD_SIZE;
                let sy = (star.y - cam.y * parallax) % STAR_FIELD_SIZE;
                const hw = canvas.width / 2, hh = canvas.height / 2;
                if (sx < -hw) sx += STAR_FIELD_SIZE;
                if (sx > hw) sx -= STAR_FIELD_SIZE;
                if (sy < -hh) sy += STAR_FIELD_SIZE;
                if (sy > hh) sy -= STAR_FIELD_SIZE;
                const screenX = sx + hw, screenY = sy + hh;
                if (screenX >= 0 && screenX <= canvas.width && screenY >= 0 && screenY <= canvas.height) {
                    ctx.fillStyle = `rgba(255,255,255,${star.brightness})`;
                    ctx.fillRect(screenX, screenY, star.size, star.size);
                }
            }
        }

        function drawBase() {
            const base = gameState.base;
            const sx = base.x - gameState.camera.x + canvas.width / 2;
            const sy = base.y - gameState.camera.y + canvas.height / 2;
            if (sx < -150 || sx > canvas.width + 150 || sy < -150 || sy > canvas.height + 150) return;

            gameState.base.pulse += 0.02;
            const t = gameState.base.pulse;
            const pulse = 0.5 + Math.sin(t) * 0.3;
            const bu = gameState.baseUpgrades;

            ctx.beginPath();
            ctx.arc(sx, sy, base.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(63,185,80,${pulse * 0.3})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2 - t * 0.15;
                ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * 35, sy + Math.sin(a) * 35);
            }
            ctx.closePath();
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 + t * 0.3;
                ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(a) * 16, sy + Math.sin(a) * 16);
            }
            ctx.closePath();
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i / 6) * Math.PI * 2 + t * 0.3;
                ctx.moveTo(sx + Math.cos(a) * 16, sy + Math.sin(a) * 16);
                ctx.lineTo(sx + Math.cos(a) * 33, sy + Math.sin(a) * 33);
            }
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 + t * 0.5;
                ctx.moveTo(sx + Math.cos(a) * 35, sy + Math.sin(a) * 35);
                ctx.lineTo(sx + Math.cos(a) * 48, sy + Math.sin(a) * 48);
                const tipX = sx + Math.cos(a) * 48, tipY = sy + Math.sin(a) * 48;
                const pa = a + Math.PI / 2;
                ctx.moveTo(tipX + Math.cos(pa) * 4, tipY + Math.sin(pa) * 4);
                ctx.lineTo(tipX - Math.cos(pa) * 4, tipY - Math.sin(pa) * 4);
            }
            ctx.strokeStyle = '#3fb950';
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;

            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
                const bx = sx + Math.cos(a) * base.radius * 0.85;
                const by = sy + Math.sin(a) * base.radius * 0.85;
                const inA = a + Math.PI;
                ctx.moveTo(bx + Math.cos(inA + 0.3) * 6, by + Math.sin(inA + 0.3) * 6);
                ctx.lineTo(bx + Math.cos(inA) * 10, by + Math.sin(inA) * 10);
                ctx.lineTo(bx + Math.cos(inA - 0.3) * 6, by + Math.sin(inA - 0.3) * 6);
            }
            ctx.strokeStyle = `rgba(63,185,80,${pulse})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            if (bu.sellBonus > 0) {
                for (let i = 0; i < bu.sellBonus * 2; i++) {
                    const a = (i / (bu.sellBonus * 2)) * Math.PI * 2 + t * 0.1;
                    ctx.beginPath();
                    ctx.arc(sx + Math.cos(a) * 35, sy + Math.sin(a) * 35, 3, 0, Math.PI * 2);
                    ctx.strokeStyle = '#3fb950';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            if (bu.defense > 0) {
                for (let i = 0; i < bu.defense * 2; i++) {
                    const a = (i / (bu.defense * 2)) * Math.PI * 2 - t * 0.8;
                    const tx = sx + Math.cos(a) * base.radius * 0.95;
                    const ty = sy + Math.sin(a) * base.radius * 0.95;
                    ctx.beginPath();
                    ctx.arc(tx, ty, 2, 0, Math.PI * 2);
                    ctx.strokeStyle = '#f85149';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                if (bu.defense >= 2) {
                    ctx.beginPath();
                    ctx.arc(sx, sy, 26, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(88,166,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }
        }

        function drawRockStripes(radius) {
            const stripeAngle = Math.PI / 6;
            const cos = Math.cos(stripeAngle), sin = Math.sin(stripeAngle);
            const spacing = radius * 0.45;
            ctx.beginPath();
            for (let offset = -1; offset <= 1; offset++) {
                const cx = -sin * offset * spacing;
                const cy = cos * offset * spacing;
                ctx.moveTo(cx + cos * radius * 0.8, cy + sin * radius * 0.8);
                ctx.lineTo(cx - cos * radius * 0.8, cy - sin * radius * 0.8);
            }
            ctx.stroke();
        }

        function drawRockDots(radius) {
            const positions = [[0.3,0.2],[-0.2,0.4],[0.1,-0.3],[-0.4,-0.1],[0.35,-0.25]];
            ctx.beginPath();
            for (const [px, py] of positions) {
                const x = px * radius, y = py * radius;
                ctx.moveTo(x + 2.5, y);
                ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            }
            ctx.stroke();
        }

        function drawRockVeins(vertices) {
            ctx.beginPath();
            const len = vertices.length;
            for (let i = 0; i < len; i += 2) {
                const v = vertices[i];
                const d = v.dist * 0.5;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(v.angle) * d, Math.sin(v.angle) * d);
            }
            for (let i = 0; i < len; i += 2) {
                const v1 = vertices[i], v2 = vertices[(i + 2) % len];
                ctx.moveTo(Math.cos(v1.angle) * v1.dist * 0.5, Math.sin(v1.angle) * v1.dist * 0.5);
                ctx.lineTo(Math.cos(v2.angle) * v2.dist * 0.5, Math.sin(v2.angle) * v2.dist * 0.5);
            }
            ctx.stroke();
        }

        function drawRocks() {
            const cam = gameState.camera;
            for (const rock of gameState.rocks) {
                const sx = rock.x - cam.x + canvas.width / 2;
                const sy = rock.y - cam.y + canvas.height / 2;
                if (sx < -60 || sx > canvas.width + 60 || sy < -60 || sy > canvas.height + 60) continue;

                const resColor = rock.resourceType.color;
                const resName = rock.resourceType.name;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(rock.rotation);

                ctx.beginPath();
                for (let i = 0; i < rock.vertices.length; i++) {
                    const v = rock.vertices[i];
                    const method = i === 0 ? 'moveTo' : 'lineTo';
                    ctx[method](Math.cos(v.angle) * v.dist, Math.sin(v.angle) * v.dist);
                }
                ctx.closePath();
                ctx.strokeStyle = resColor;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.strokeStyle = resColor;
                ctx.lineWidth = 0.8;
                ctx.globalAlpha = 0.5;
                if (resName === 'copper') drawRockStripes(rock.radius);
                else if (resName === 'platinum') drawRockDots(rock.radius);
                else if (resName === 'crystal') drawRockVeins(rock.vertices);
                ctx.globalAlpha = 1;

                ctx.restore();
            }
        }

        function drawBullets() {
            for (const b of gameState.bullets) {
                const sx = b.x - gameState.camera.x + canvas.width / 2;
                const sy = b.y - gameState.camera.y + canvas.height / 2;
                ctx.strokeStyle = b.turret ? '#58a6ff' : '#f85149';
                ctx.lineWidth = b.turret ? 1.5 : 2;
                const len = b.turret ? BULLET_LENGTH * 0.7 : BULLET_LENGTH;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - Math.cos(b.angle) * len, sy - Math.sin(b.angle) * len);
                ctx.stroke();
            }
        }

        function drawEnemies() {
            const cam = gameState.camera;
            for (const e of gameState.enemies) {
                const sx = e.x - cam.x + canvas.width / 2;
                const sy = e.y - cam.y + canvas.height / 2;
                if (sx < -50 || sx > canvas.width + 50 || sy < -50 || sy > canvas.height + 50) continue;

                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(e.angle);
                ctx.strokeStyle = '#f85149';
                ctx.lineWidth = 1.5;

                if (e.type === 'turret') {
                    const r = e.radius;
                    ctx.beginPath();
                    ctx.moveTo(0, -r); ctx.lineTo(r, 0); ctx.lineTo(0, r); ctx.lineTo(-r, 0); ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(r * 0.6, 0); ctx.lineTo(r * 1.4, 0);
                    ctx.stroke();
                } else if (e.type === 'drone') {
                    const r = e.radius;
                    ctx.beginPath();
                    ctx.moveTo(r, 0); ctx.lineTo(-r * 0.7, -r * 0.6); ctx.lineTo(-r * 0.4, 0); ctx.lineTo(-r * 0.7, r * 0.6); ctx.closePath();
                    ctx.stroke();
                    if (e.behavior.state === 'dash') {
                        ctx.strokeStyle = '#f0883e';
                        ctx.beginPath();
                        ctx.moveTo(-r * 0.5, 0);
                        ctx.lineTo(-r * 1.2, (Math.random() - 0.5) * 4);
                        ctx.stroke();
                    }
                } else if (e.type === 'gunship') {
                    const r = e.radius;
                    ctx.beginPath();
                    for (let p = 0; p < 5; p++) {
                        const a = (p / 5) * Math.PI * 2 - Math.PI / 2;
                        const px = Math.cos(a) * r, py = Math.sin(a) * r;
                        p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (e.type === 'sentinel') {
                    const r = e.radius;
                    ctx.strokeStyle = '#e0e0e0';
                    ctx.beginPath();
                    for (let p = 0; p < 6; p++) {
                        const a = (p / 6) * Math.PI * 2;
                        const px = Math.cos(a) * r, py = Math.sin(a) * r;
                        p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.stroke();
                    // Inner eye
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
                    ctx.stroke();
                    // Blink flash
                    if (e.behavior.blinkTimer && e.behavior.blinkTimer < 0.3) {
                        ctx.strokeStyle = 'rgba(224, 224, 224, 0.5)';
                        ctx.beginPath();
                        ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                ctx.restore();

                // HP bar
                if (e.hp < e.maxHp) {
                    const barW = e.radius * 1.5;
                    const barH = 3;
                    const bx = sx - barW / 2;
                    const by = sy - e.radius - 8;
                    ctx.fillStyle = '#21262d';
                    ctx.fillRect(bx, by, barW, barH);
                    ctx.fillStyle = '#f85149';
                    ctx.fillRect(bx, by, barW * (e.hp / e.maxHp), barH);
                }
            }
        }

        function drawEnemyBullets() {
            ctx.strokeStyle = '#f85149';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.8;
            for (const b of gameState.enemyBullets) {
                const sx = b.x - gameState.camera.x + canvas.width / 2;
                const sy = b.y - gameState.camera.y + canvas.height / 2;
                const angle = Math.atan2(b.vy, b.vx);
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - Math.cos(angle) * 8, sy - Math.sin(angle) * 8);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawResources() {
            const cam = gameState.camera;
            for (const r of gameState.resources) {
                const sx = r.x - cam.x + canvas.width / 2;
                const sy = r.y - cam.y + canvas.height / 2 + Math.sin(r.bobPhase) * 3;
                if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) continue;

                const alpha = r.life < 5 ? r.life / 5 : 1;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.rotate(r.bobPhase * 0.5);
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    const method = i === 0 ? 'moveTo' : 'lineTo';
                    ctx[method](Math.cos(a) * 6, Math.sin(a) * 6);
                }
                ctx.closePath();
                ctx.strokeStyle = r.color.replace(')', `,${alpha})`).replace('rgb', 'rgba').replace('#', '');
                ctx.strokeStyle = r.color;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }

        function drawParticles() {
            for (const p of gameState.particles) {
                const sx = p.x - gameState.camera.x + canvas.width / 2;
                const sy = p.y - gameState.camera.y + canvas.height / 2;
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(sx - p.size / 2, sy - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawTug() {
            const tug = gameState.rescueTug;
            if (!tug) return;
            const ship = gameState.ship;
            const cam = gameState.camera;
            const sx = (tug.x - cam.x) + canvas.width / 2;
            const sy = (tug.y - cam.y) + canvas.height / 2;
            const size = SHIP_SIZE * 0.6;

            ctx.save();
            ctx.translate(sx, sy);
            ctx.rotate(tug.angle);
            ctx.beginPath();
            ctx.moveTo(size, 0);
            ctx.lineTo(-size * 0.7, -size * 0.6);
            ctx.lineTo(-size * 0.4, 0);
            ctx.lineTo(-size * 0.7, size * 0.6);
            ctx.closePath();
            ctx.strokeStyle = '#e3b341';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            if (tug.attached) {
                const shipSx = canvas.width / 2;
                const shipSy = canvas.height / 2;
                ctx.beginPath();
                ctx.setLineDash([6, 4]);
                ctx.moveTo(sx, sy);
                ctx.lineTo(shipSx, shipSy);
                ctx.strokeStyle = '#e3b341';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawShipHull(s) {
            const level = gameState.upgrades.hull;
            ctx.beginPath();
            switch (level) {
                case 0:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(-s * 0.7, -s * 0.6);
                    ctx.lineTo(-s * 0.4, 0);
                    ctx.lineTo(-s * 0.7, s * 0.6);
                    break;
                case 1:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(-s * 0.5, -s * 0.7);
                    ctx.lineTo(-s * 0.7, -s * 0.7);
                    ctx.lineTo(-s * 0.6, -s * 0.4);
                    ctx.lineTo(-s * 0.4, 0);
                    ctx.lineTo(-s * 0.6, s * 0.4);
                    ctx.lineTo(-s * 0.7, s * 0.7);
                    ctx.lineTo(-s * 0.5, s * 0.7);
                    break;
                case 2:
                    ctx.moveTo(s, 0);
                    ctx.lineTo(s * 0.3, -s * 0.4);
                    ctx.lineTo(-s * 0.5, -s * 0.8);
                    ctx.lineTo(-s * 0.8, -s * 0.6);
                    ctx.lineTo(-s * 0.5, 0);
                    ctx.lineTo(-s * 0.8, s * 0.6);
                    ctx.lineTo(-s * 0.5, s * 0.8);
                    ctx.lineTo(s * 0.3, s * 0.4);
                    break;
                case 3:
                    ctx.moveTo(s * 1.1, 0);
                    ctx.lineTo(s * 0.5, -s * 0.3);
                    ctx.lineTo(s * 0.3, -s * 0.3);
                    ctx.lineTo(-s * 0.4, -s * 0.9);
                    ctx.lineTo(-s * 0.9, -s * 0.5);
                    ctx.lineTo(-s * 0.5, 0);
                    ctx.lineTo(-s * 0.9, s * 0.5);
                    ctx.lineTo(-s * 0.4, s * 0.9);
                    ctx.lineTo(s * 0.3, s * 0.3);
                    ctx.lineTo(s * 0.5, s * 0.3);
                    break;
                case 4:
                    ctx.moveTo(s * 1.2, 0);
                    ctx.lineTo(s * 0.4, -s * 0.35);
                    ctx.lineTo(-s * 0.2, -s * 0.5);
                    ctx.lineTo(-s * 0.6, -s * 0.9);
                    ctx.lineTo(-s * 1.0, -s * 0.6);
                    ctx.lineTo(-s * 0.8, -s * 0.3);
                    ctx.lineTo(-s * 0.6, 0);
                    ctx.lineTo(-s * 0.8, s * 0.3);
                    ctx.lineTo(-s * 1.0, s * 0.6);
                    ctx.lineTo(-s * 0.6, s * 0.9);
                    ctx.lineTo(-s * 0.2, s * 0.5);
                    ctx.lineTo(s * 0.4, s * 0.35);
                    break;
                default:
                    ctx.moveTo(s * 1.3, 0);
                    ctx.lineTo(s * 0.7, -s * 0.2);
                    ctx.lineTo(s * 0.5, -s * 0.45);
                    ctx.lineTo(-s * 0.1, -s * 0.55);
                    ctx.lineTo(-s * 0.5, -s * 1.0);
                    ctx.lineTo(-s * 1.0, -s * 0.7);
                    ctx.lineTo(-s * 0.8, -s * 0.35);
                    ctx.lineTo(-s * 0.7, 0);
                    ctx.lineTo(-s * 0.8, s * 0.35);
                    ctx.lineTo(-s * 1.0, s * 0.7);
                    ctx.lineTo(-s * 0.5, s * 1.0);
                    ctx.lineTo(-s * 0.1, s * 0.55);
                    ctx.lineTo(s * 0.5, s * 0.45);
                    ctx.lineTo(s * 0.7, s * 0.2);
                    break;
            }
            ctx.closePath();
            ctx.strokeStyle = gameState.shipColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            if (level >= 3) {
                ctx.beginPath();
                ctx.moveTo(s * 0.4, -s * 0.15);
                ctx.lineTo(-s * 0.2, -s * 0.3);
                ctx.moveTo(s * 0.4, s * 0.15);
                ctx.lineTo(-s * 0.2, s * 0.3);
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.4;
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function drawUpgradeAddons(s) {
            const u = gameState.upgrades;

            if (u.fuel > 0) {
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1;
                const count = Math.ceil(u.fuel / 2);
                for (let i = 0; i < count; i++) {
                    const xOff = -s * 0.2 - i * s * 0.15;
                    ctx.strokeRect(xOff - 2, -s * 0.7 - 3, 4, 5);
                    ctx.strokeRect(xOff - 2, s * 0.7 - 2, 4, 5);
                }
            }

            if (u.cargo > 0) {
                ctx.strokeStyle = '#8b949e';
                ctx.lineWidth = 1;
                const ext = u.cargo * 0.06;
                ctx.beginPath();
                ctx.moveTo(-s * 0.5, -s * (0.5 + ext));
                ctx.lineTo(-s * 0.7, -s * (0.5 + ext));
                ctx.moveTo(-s * 0.5, s * (0.5 + ext));
                ctx.lineTo(-s * 0.7, s * (0.5 + ext));
                ctx.stroke();
            }

            if (u.speed > 0) {
                ctx.strokeStyle = '#d2a8ff';
                ctx.lineWidth = 0.7;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                for (let i = 0; i < Math.min(u.speed, 3); i++) {
                    const yOff = (i - 1) * s * 0.12;
                    ctx.moveTo(s * 0.6, yOff);
                    ctx.lineTo(-s * 0.3, yOff);
                }
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            if (u.fireRate > 0) {
                ctx.strokeStyle = '#f85149';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                if (u.fireRate >= 1) { ctx.moveTo(s * 0.8, -s * 0.15); ctx.lineTo(s * 1.1, -s * 0.15); }
                if (u.fireRate >= 2) { ctx.moveTo(s * 0.8, s * 0.15); ctx.lineTo(s * 1.1, s * 0.15); }
                if (u.fireRate >= 4) { ctx.moveTo(s * 0.9, -s * 0.3); ctx.lineTo(s * 1.15, -s * 0.3); }
                ctx.stroke();
            }

            if (u.thrust > 0) {
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1;
                ctx.beginPath();
                const nw = s * 0.12 + u.thrust * s * 0.03;
                ctx.moveTo(-s * 0.45, -nw); ctx.lineTo(-s * 0.55, -nw * 1.3);
                ctx.moveTo(-s * 0.45, nw); ctx.lineTo(-s * 0.55, nw * 1.3);
                if (u.thrust >= 3) {
                    ctx.moveTo(-s * 0.6, -s * 0.35); ctx.lineTo(-s * 0.7, -s * 0.4);
                    ctx.moveTo(-s * 0.6, s * 0.35); ctx.lineTo(-s * 0.7, s * 0.4);
                }
                ctx.stroke();
            }

            if (u.scanner > 0) {
                ctx.strokeStyle = '#3fb950';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(s * 0.1, -s * 0.4);
                ctx.lineTo(s * 0.1, -s * 0.7);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(s * 0.1, -s * 0.7, 3 + u.scanner, -Math.PI * 0.7, -Math.PI * 0.3);
                ctx.stroke();
            }

            if (u.density > 0) {
                ctx.strokeStyle = '#e3b341';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                const dl = s * 0.2 + u.density * s * 0.05;
                ctx.moveTo(s, 0); ctx.lineTo(s + dl, 0);
                if (u.density >= 2) {
                    ctx.moveTo(s + 2, -3); ctx.lineTo(s + dl * 0.5, 0); ctx.lineTo(s + 2, 3);
                }
                ctx.stroke();
            }

            if (u.magnet > 0) {
                ctx.strokeStyle = '#58a6ff';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(0, s * 0.5, s * 0.4 + u.magnet * 2, Math.PI * 0.2, Math.PI * 0.8);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }
        }

        function drawShip() {
            const ship = gameState.ship;
            if (ship.invulnTimer > 0 && ship.invulnTimer !== Infinity && Math.floor(ship.invulnTimer * 10) % 2 === 0) return;

            const screenX = canvas.width / 2;
            const screenY = canvas.height / 2;

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(ship.angle);

            drawShipHull(ship.size);
            drawUpgradeAddons(ship.size);

            if (ship.thrust > 0 && ship.fuel > 0) {
                const flameSize = ship.size * 0.5 * (0.7 + Math.random() * 0.3);
                ctx.beginPath();
                ctx.moveTo(-ship.size * 0.4, -ship.size * 0.2);
                ctx.lineTo(-ship.size * 0.4 - flameSize, 0);
                ctx.lineTo(-ship.size * 0.4, ship.size * 0.2);
                ctx.strokeStyle = '#f0883e';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawHUD() {
            const ship = gameState.ship;
            const dist = Math.sqrt(ship.x * ship.x + ship.y * ship.y);
            const vel = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);

            ctx.font = '13px Courier New';
            ctx.textAlign = 'left';
            let y = 24;

            ctx.fillStyle = '#484f58';
            ctx.textAlign = 'right';
            ctx.fillText('v2.0', canvas.width - 14, 24);
            ctx.textAlign = 'left';

            ctx.fillStyle = '#8b949e';
            ctx.fillText(`DIST: ${Math.floor(dist)}`, 14, y); y += 18;
            ctx.fillText(`VEL: ${Math.floor(vel)}`, 14, y); y += 18;

            const fuelPct = ship.fuel / ship.maxFuel;
            ctx.fillStyle = fuelPct < 0.2 ? '#f85149' : '#8b949e';
            const fuelBars = Math.ceil(fuelPct * 10);
            ctx.fillText(`FUEL: ${'|'.repeat(fuelBars)}${'-'.repeat(10 - fuelBars)} ${Math.floor(ship.fuel)}`, 14, y); y += 18;

            const hullPct = ship.hull / ship.maxHull;
            ctx.fillStyle = hullPct <= 0.34 ? '#f85149' : '#8b949e';
            ctx.fillText(`HULL: ${'█'.repeat(ship.hull)}${'░'.repeat(ship.maxHull - ship.hull)}`, 14, y); y += 18;

            ctx.fillStyle = '#8b949e';
            ctx.fillText(`CARGO: ${ship.cargo.length}/${ship.maxCargo}`, 14, y); y += 18;
            ctx.fillText(`CR: ${gameState.credits}`, 14, y);

            if (gameState.cargoFullFlash > 0) {
                ctx.fillStyle = '#f85149';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('CARGO FULL', canvas.width / 2, canvas.height - 40);
            }

            if (gameState.fuelWarnFlash > 0) {
                const alpha = Math.min(1, gameState.fuelWarnFlash);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = gameState.fuelWarnMsg === 'LOW FUEL' ? '#f85149' : '#f0883e';
                ctx.font = '18px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(gameState.fuelWarnMsg, canvas.width / 2, canvas.height / 2 - 60);
                ctx.globalAlpha = 1;
            }

            // Home indicator
            if (dist > 100) {
                const homeAngle = Math.atan2(-ship.y, -ship.x);
                const indicatorDist = 60;
                const ix = canvas.width / 2 + Math.cos(homeAngle) * indicatorDist;
                const iy = canvas.height / 2 + Math.sin(homeAngle) * indicatorDist;
                ctx.beginPath();
                ctx.arc(ix, iy, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#3fb950';
                ctx.fill();
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('HOME', ix, iy + 14);
            }

            // Return-to-base arrow when carrying valuable cargo
            const cargoVal = ship.cargo.reduce((s, i) => s + i.value, 0);
            if (cargoVal > 50 && dist > 200) {
                const arrowAngle = Math.atan2(-ship.y, -ship.x);
                const ax = canvas.width / 2 + Math.cos(arrowAngle) * 90;
                const ay = canvas.height / 2 + Math.sin(arrowAngle) * 90;
                ctx.save();
                ctx.translate(ax, ay);
                ctx.rotate(arrowAngle);
                ctx.strokeStyle = '#3fb950';
                ctx.globalAlpha = 0.4 + Math.sin(Date.now() * 0.003) * 0.2;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(8, 0); ctx.lineTo(-4, -5); ctx.moveTo(8, 0); ctx.lineTo(-4, 5);
                ctx.stroke();
                ctx.globalAlpha = 1;
                ctx.restore();
            }

            // Minimap (bottom-left)
            const mmSize = 100;
            const mmX = 14;
            const mmY = canvas.height - mmSize - 14;
            const mmScale = 20000 / (mmSize / 2);
            ctx.save();
            ctx.globalAlpha = 0.7;
            ctx.strokeStyle = '#21262d';
            ctx.lineWidth = 1;
            ctx.strokeRect(mmX, mmY, mmSize, mmSize);

            // Distance rings on minimap
            const rings = [2000, 5000, 10000];
            ctx.strokeStyle = '#161b22';
            rings.forEach(r => {
                const rr = r / mmScale;
                ctx.beginPath();
                ctx.arc(mmX + mmSize/2, mmY + mmSize/2, rr, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Base dot
            const baseMmX = mmX + mmSize/2;
            const baseMmY = mmY + mmSize/2;
            ctx.fillStyle = '#3fb950';
            ctx.beginPath();
            ctx.arc(baseMmX, baseMmY, 2, 0, Math.PI * 2);
            ctx.fill();

            // Ship dot
            const shipMmX = mmX + mmSize/2 + ship.x / mmScale;
            const shipMmY = mmY + mmSize/2 + ship.y / mmScale;
            ctx.fillStyle = '#58a6ff';
            ctx.beginPath();
            ctx.arc(shipMmX, shipMmY, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Radar dots (enemies + resources) if radar upgrade
            if (gameState.upgrades.scanner >= 1) {
                const radarRange = 800 + gameState.upgrades.scanner * 400;
                for (const e of gameState.enemies) {
                    const edx = e.x - ship.x, edy = e.y - ship.y;
                    if (Math.sqrt(edx*edx + edy*edy) > radarRange) continue;
                    const emx = mmX + mmSize/2 + e.x / mmScale;
                    const emy = mmY + mmSize/2 + e.y / mmScale;
                    if (emx < mmX || emx > mmX+mmSize || emy < mmY || emy > mmY+mmSize) continue;
                    ctx.fillStyle = '#f85149';
                    ctx.beginPath();
                    ctx.arc(emx, emy, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const r of gameState.resources) {
                    const rdx = r.x - ship.x, rdy = r.y - ship.y;
                    if (Math.sqrt(rdx*rdx + rdy*rdy) > radarRange) continue;
                    const rmx = mmX + mmSize/2 + r.x / mmScale;
                    const rmy = mmY + mmSize/2 + r.y / mmScale;
                    if (rmx < mmX || rmx > mmX+mmSize || rmy < mmY || rmy > mmY+mmSize) continue;
                    ctx.fillStyle = r.color;
                    ctx.beginPath();
                    ctx.arc(rmx, rmy, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.restore();

            // Quest HUD - show all active tracks
            ctx.textAlign = 'right';
            const qx = canvas.width - 14;
            let qy = 44;
            for (const [trackId, track] of Object.entries(QUEST_TRACKS)) {
                const qt = gameState.questTracks[trackId];
                if (!qt.unlocked || qt.current >= track.quests.length) continue;
                const quest = track.quests[qt.current];
                ctx.font = '10px Courier New';
                ctx.fillStyle = track.color;
                ctx.fillText(`${track.icon} ${quest.name}`, qx, qy);
                ctx.fillStyle = '#6e7681';
                let prog = qt.progress;
                if (quest.type === 'distance') prog = Math.min(Math.floor(Math.sqrt(ship.x*ship.x+ship.y*ship.y)), quest.target);
                else if (quest.type === 'return_alive' || quest.type === 'return_full_hull') prog = Math.min(Math.floor(gameState.tripStats.maxDist), quest.target);
                ctx.fillText(`${prog}/${quest.target}`, qx, qy + 12);
                qy += 28;
            }

            // Quest complete flash
            if (gameState.questFlash > 0) {
                const alpha = Math.min(1, gameState.questFlash);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#3fb950';
                ctx.font = '16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('QUEST COMPLETE', canvas.width / 2, canvas.height / 2 - 90);
                ctx.globalAlpha = 1;
            }

            // Transmission display
            if (gameState.story.active) {
                const t = gameState.story.active;
                const visibleText = t.text.substring(0, Math.floor(t.charIndex));
                const tx = canvas.width / 2;
                const maxW = Math.min(400, canvas.width - 40);

                ctx.save();
                ctx.font = '11px Courier New';
                ctx.textAlign = 'center';

                // Pre-calculate wrapped lines for box sizing
                const words = visibleText.split(' ');
                const lines = [];
                let line = '';
                for (const word of words) {
                    const test = line + word + ' ';
                    if (ctx.measureText(test).width > maxW) {
                        lines.push(line.trim());
                        line = word + ' ';
                    } else {
                        line = test;
                    }
                }
                if (line.trim()) lines.push(line.trim());

                const lineHeight = 14;
                const boxH = 28 + lines.length * lineHeight + 12;
                const ty = canvas.height - 30 - boxH;

                // Border box
                ctx.strokeStyle = '#3fb950';
                ctx.lineWidth = 1;
                ctx.globalAlpha = 0.6 + Math.sin(Date.now() * 0.005) * 0.2;
                ctx.strokeRect(tx - maxW/2 - 10, ty, maxW + 20, boxH);
                ctx.globalAlpha = 1;

                // From line
                ctx.fillStyle = '#58a6ff';
                ctx.fillText(`[${t.from}]`, tx, ty + 16);

                // Message body
                ctx.fillStyle = '#3fb950';
                ctx.globalAlpha = 0.9;
                for (let li = 0; li < lines.length; li++) {
                    ctx.fillText(lines[li], tx, ty + 32 + li * lineHeight);
                }
                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if (gameState.paused || gameState.shopOpen || gameState.dead || gameState.stranded) return;

            const dt = Math.min((timestamp - gameState.lastTime) / 1000, 0.05);
            gameState.lastTime = timestamp;

            if (gameState.rescued) {
                updateRescue(dt);
                updateParticles(dt);
            } else {
                updateShip(dt);
                updateShooting(dt);
                updateBullets(dt);
                updateRocks(dt);
                updateEnemies(dt);
                updateEnemyBullets(dt);
                updateParticles(dt);
                updateResources(dt);
                checkCollisions();
                checkEnemyCollisions();
                if (!gameState.dead) checkDocking();
            }

            ctx.fillStyle = '#0d1117';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawStars();
            drawBase();
            if (!gameState.rescued) {
                drawResources();
                drawRocks();
                drawEnemies();
                drawBullets();
                drawEnemyBullets();
            }
            drawParticles();
            if (gameState.rescued) drawTug();
            drawShip();
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        // --- Fullscreen ---
        function requestFullscreen() {
            const el = document.documentElement;
            const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
            if (rfs && !document.fullscreenElement && !document.webkitFullscreenElement) {
                rfs.call(el).catch(() => {});
            }
        }
        document.addEventListener('touchstart', function goFull() {
            requestFullscreen();
            document.removeEventListener('touchstart', goFull);
        }, { once: true });

        // --- Start ---
        window.gameState = gameState;
        window.sellCargo = sellCargo;
        window.buyUpgrade = buyUpgrade;
        window.buyBaseUpgrade = buyBaseUpgrade;
        window.gameLoop = gameLoop;
        window.QUEST_TRACKS = QUEST_TRACKS;
        try { detectMobile(); } catch(e) { console.warn('Mobile init failed:', e); }
        loadGame();
        applyUpgrades();
        checkQuestUnlocks();
        gameState.ship.hull = gameState.ship.maxHull;
        gameState.ship.fuel = gameState.ship.maxFuel;
        gameState.tripStats.startHull = gameState.ship.maxHull;

        ctx.fillStyle = '#0d1117';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawStars();
        drawBase();
        drawShip();
        drawHUD();

        gameState.lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    })();
    </script>
</body>
</html>
